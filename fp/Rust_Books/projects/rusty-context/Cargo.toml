[package]
name = "rusty-context"
version = "0.1.0"
edition = "2021"
description = "Self-Evolving Agentic Context Management Ecosystem"

[dependencies]
rig-core = "0.6.1"
tokio = { version = "1.34", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1.0"
async-trait = "0.1.74"
