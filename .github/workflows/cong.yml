name: cong

# Chạy tools/cong.sh (toàn bộ ~15 cổng kiểm chất lượng nội dung + mã) trên
# mọi PR và mọi lần đẩy lên main/mvp. Trước dự án KHÔNG có CI nào — mọi lần
# kiểm chỉ dựa vào chạy tay, nên PR có thể lọt qua mà không ai chạy đủ cổng.
on:
  push:
    branches: [main, mvp]
  pull_request:

concurrency:
  group: cong-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cong:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # rust-toolchain.toml ở gốc repo tự ghim channel/target — action này
      # chỉ cần cài ĐÚNG target wasm32 thêm vào, phần còn lại rustup tự đọc.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # apps/byte/src-tauri là thành viên Cargo workspace (Cargo.toml gốc,
      # `members = ["crates/*", "apps/byte/src-tauri"]`) — `cargo test
      # --workspace` trong cong.sh BIÊN DỊCH nó dù không chạy app thật, và
      # crate Tauri cần GTK/WebKitGTK để biên dịch trên Linux dù không có
      # màn hình nào mở ra. Danh sách gói theo đúng tài liệu CI chính thức
      # của Tauri v2 cho Ubuntu.
      - name: Cài thư viện hệ thống cho Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev \
            libayatana-appindicator3-dev libgtk-3-dev

      - name: Cài dependency (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Build mọi package + app
        run: pnpm build

      - name: Chuẩn bị asset cho app (nội dung + Pyodide + numpy + WASM Rust + ts-lib)
        # ĐÚNG bằng `pnpm run chuan-bi` của apps/byte, chạy TỪNG bước riêng để
        # log rõ bước nào chậm. Lần đầu viết workflow này chỉ chạy numpy+wasm,
        # tưởng thế là đủ cho tools/kiem_ma_bai_hoc.mjs — SAI: script đó còn
        # cần apps/byte/public/pyodide/pyodide-lock.json (do bước `pyodide`
        # copy sang, KHÔNG PHẢI bước `numpy`), và cổng "App ship đủ bài"/
        # "Test JS" cần public/noi-dung/index.json (bước `noi-dung`) — cả hai
        # điều này chỉ lộ ra khi chạy CI thật, đã xác nhận qua log lỗi thật
        # (`gh run view --log-failed`), không phải suy đoán.
        run: |
          cd apps/byte
          pnpm run noi-dung
          pnpm run thu-vien
          pnpm run pyodide
          pnpm run numpy
          pnpm run wasm
          pnpm run ts-lib

      - name: tools/cong.sh — toàn bộ cổng
        run: bash tools/cong.sh
