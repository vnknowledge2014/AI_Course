    y_chinh: "Bài BOSS của track: hiện thực hoá ĐẦY ĐỦ FP DI (bài 10-11) — MỘT use case function nhận MỘT object `deps: AppDeps` chứa NHIỀU repository (bài 37-41) + service khác (thông báo) + helper thuần (sinhId, gioHienTai); use case orchestrate XEN KẼ bước thuần (validate, bài 33) và bước IO (tìm/lưu qua repo, gửi thông báo) — Sandwich Pattern (bài 8) ở QUY MÔ ứng dụng đầy đủ. Viết `dangKyKhachHang(deps, ten, emailTho): Promise<Result<KhachHang, string[]>>` — validate (thuần, gom lỗi qua `map2GomLoi`), kiểm trùng email (IO), tạo Entity (bài 4), lưu (IO), gửi email chào mừng (IO). Test TOÀN BỘ luồng bằng `testDeps` — in-memory repo (bài 38) + fake notification (mảng ghi lại email đã \"gửi\"), KHÔNG mock library nào, kể cả side-effect."
