  - so: 41
    slug: unit-of-work
    title: "Unit of Work — transaction boundary cho nhiều repo cùng lúc"
    teaches: [ddd.unit-of-work]
    requires: [ddd.generic-repository]
    y_chinh: "Khi cần đổi NHIỀU \"kệ sách\" cùng lúc (ví dụ: đơn hàng VÀ tồn kho), gom các repository liên quan vào MỘT object `{donHang, sanPham, commit, rollback}` để đảm bảo TẤT CẢ thay đổi cùng THÀNH CÔNG hoặc cùng THẤT BẠI (all-or-nothing). Cơ chế \"pending Map\" vs \"committed Map\": mọi `save()` ghi vào pending trước, chỉ CHUYỂN sang committed khi `commit()` được gọi. Test case \"không đủ tồn kho\": `placeOrder` fail giữa chừng KHÔNG làm hỏng state đã commit TRƯỚC ĐÓ."
  - so: 42
    slug: boss-full-application-wiring
    title: "BOSS — Full Application Wiring: gom TẤT CẢ dependency vào AppDeps"
