    y_chinh: "`v.iter().map(|x| x * 2).collect()`, `v.into_iter().filter(|x| x % 2 == 0).collect()`, `v.iter().sum()` — closure truyền TRỰC TIẾP cho `.map()`/`.filter()` (đã đo thật, dùng được); CHỈ báo trước một điều CẤM: KHÔNG gán closure vào một biến rồi gọi qua tên (`let f = |x| x+1; f(5)` là lỗi cài đặt thật của engine, xem R4-T40b-su-that-do-duoc.md) — luôn truyền trực tiếp. Bài này hé mở hướng track FP sắp tới (T4.2 HOF & composition) mà không đi sâu — chỉ đủ để BOSS dùng được nếu cần."
