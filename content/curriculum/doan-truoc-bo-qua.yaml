# Khối `predict` được phép hỏi lại một đoạn mã đã in kèm đáp án — khai ở đây,
# kèm lý do. Cổng: `tools/kiem_doan_truoc.py`.
#
# Khai một ca ở đây là nói rằng biết trước đáp án KHÔNG làm hỏng phép đo của
# khối ấy. Chỉ đúng khi câu hỏi thật sự nằm ở chỗ khác — thường là khi đoạn mã
# trên và đoạn trong `predict` khác nhau ở đúng thứ bài đang dạy, mà cái khác
# ấy KHÔNG đổi kết quả.
#
# Khai một ca rồi mà cổng không còn khớp là LỖI, không phải chuyện lành: nghĩa
# là bài đã đổi và tờ giấy miễn trừ nằm lại, sẵn sàng tha cho một lỗi thật.

# HỎI Ở CHỖ KHÁC. Đoạn trên là hàm KHÔNG có nhãn; đoạn trong `predict` là đúng
# hàm ấy CÓ thêm một nhãn ghi "không ghi giá thì tính 45000 một tô". Câu hỏi là
# nhãn có tạo ra giá trị mặc định không — và đáp án đúng giống hệt đoạn trên
# chính là luận điểm của bài: nhãn không chạy, nó chỉ là chữ. Người học tin
# nhãn sẽ chọn "In ra 90000", và cuộn lên cũng không cứu được họ, vì đoạn trên
# là một hàm khác.
