    tom_tat: "Bốn mẫu tính chất phổ biến (bất biến, idempotent, đi-về, oracle), tự thu nhỏ đầu vào lỗi, capstone kiểm tính chất trả về Result."
  - so: 6
    ten: "Kiểm thử đột biến"
    tom_tat: "Đột biến là gì, độ phủ vs điểm đột biến, các loại đột biến (ranh giới, số học, logic, hoán đổi giá trị), đột biến tương đương, BOSS săn đột biến thật."

bai:
# ── Cụm 1 (bài 1-5): Chu trình TDD — Nền tảng — nguồn chương 31.1-31.2 ────
  - so: 1
    slug: tdd-la-gi-do-xanh-tinh-gon
    title: "TDD là gì — Đỏ, Xanh, Tinh gọn"
    teaches: [kt.tdd-cycle]
    requires: [ts.adt-gate-boss]
    y_chinh: "Test-Driven Development: viết \"kịch bản\" (test) TRƯỚC \"buổi diễn\" (code) — Đỏ (viết test CHO hành vi CHƯA tồn tại, test THẤT BẠI, chứng minh test THẬT SỰ kiểm được điều gì đó) → Xanh (viết CODE TỐI THIỂU để test qua, KHÔNG hơn) → Tinh gọn (cải thiện cấu trúc, test LÀM lưới an toàn). TDD là PHƯƠNG PHÁP THIẾT KẾ, không phải \"viết test sau cho có\" — code VIẾT SAU luôn có xu hướng chỉ PHẢN ÁNH cách nó ĐÃ được viết, code VIẾT TRƯỚC buộc suy nghĩ về HÀNH VI mong muốn trước khi bận tâm CÀI ĐẶT."
  - so: 2
    slug: tu-viet-assert
    title: "Tự viết assertEqual/assertDeepEqual — không có thư viện test nào"
    teaches: [kt.hand-rolled-assert]
    requires: [kt.tdd-cycle]
    y_chinh: "Sandbox KHÔNG có `node:assert`/jest/vitest — một \"test\" đơn giản LÀ một lời gọi hàm NÉM lỗi khi SAI, in PASS khi ĐÚNG. `assertEqual<T>(actual, expected, label)` so sánh `===`; `assertDeepEqual<T>` so sánh qua `JSON.stringify` (đủ dùng cho object/mảng phẳng trong track này). HAI hàm này ĐƯỢC DÙNG LẠI xuyên suốt CẢ track — dạy MỘT LẦN, áp dụng MỌI bài sau."
  - so: 3
    slug: do-truoc-xanh-sau
    title: "Đỏ trước, Xanh sau — viết assertion trước, code tối thiểu sau"
    teaches: [kt.red-then-green]
    requires: [kt.hand-rolled-assert]
    y_chinh: "Viết assertion CHO hành vi MONG MUỐN của `parsePrice` (chuỗi giá tiền → số, hoặc `null` nếu không hợp lệ) TRƯỚC KHI cài đặt (Đỏ — assertion sẽ THẤT BẠI vì hàm CHƯA tồn tại/CHƯA đúng), RỒI viết code TỐI THIỂU khiến assertion ĐÓ qua (Xanh). Học viên cài `parsePrice(input): number | null` cho tới khi các assertion ĐÃ VIẾT SẴN đều PASS — trải nghiệm TRỰC TIẾP nhịp Đỏ→Xanh, không chỉ đọc VỀ nó."
  - so: 4
    slug: truong-hop-bien-co-y-thuc
    title: "Trường hợp biên có Ý THỨC — liệt kê TRƯỚC khi viết code"
    teaches: [kt.edge-cases-first]
    requires: [kt.red-then-green]
    y_chinh: "TDD BUỘC liệt kê rỗng/âm/không/biên TRƯỚC KHI viết code (không phải nghĩ thêm SAU) — mở rộng `parsePrice` (bài 3) với `\"0\"` (hợp lệ), `\"\"` (null), `\"-5\"` (null), `\"12.345\"` (làm tròn 2 chữ số). MỖI trường hợp biên là MỘT assertion RIÊNG, viết TRƯỚC, rồi ĐIỀU CHỈNH cài đặt cho tới khi ĐỦ qua HẾT — nối trực tiếp kỷ luật \"đo trước khi viết\" ĐÃ dùng xuyên suốt dự án."
  - so: 5
    slug: tinh-gon-khong-doi-hanh-vi
    title: "Capstone: Tinh gọn — đổi CÁCH LÀM, giữ NGUYÊN test"
    teaches: [kt.refactor-safety-net]
    requires: [kt.edge-cases-first]
    y_chinh: "Bài chốt cụm, code có chấm điểm sống: viết `parsePriceV2` (cài đặt KHÁC HẲN — dùng regex thay vì `Number()` trực tiếp) cho `parsePrice` (bài 3-4), CHẠY LẠI **Y NGUYÊN** bộ assertion ĐÃ VIẾT (không sửa MỘT assertion nào) — CẢ HAI cài đặt PHẢI qua HẾT. Đây LÀ Ý NGHĨA của \"Tinh gọn\" (Refactor): đổi **CÁCH** làm (HOW), giữ NGUYÊN **CÁI** làm ra (WHAT) — test là LƯỚI AN TOÀN, KHÔNG PHẢI thứ phải viết LẠI mỗi lần đổi cài đặt."

# ── Cụm 2 (bài 6-10): Test Domain Logic — nguồn chương 31.3 ───────────────
  - so: 6
    slug: test-ham-tra-ve-result
    title: "Test hàm trả về Result — cả nhánh THÀNH CÔNG lẫn nhánh LỖI"
    teaches: [kt.test-result-branches]
    requires: [kt.refactor-safety-net]
    y_chinh: "Hàm trả `Result<T,E>` (ĐÃ học T4.5) cần test **CẢ HAI PHÍA**: nhánh `ok` (giá trị ĐÚNG) VÀ **TỪNG** nhánh `loi` (MỖI mã lỗi RIÊNG, không CHỈ một trường hợp lỗi ĐẠI DIỆN). `xacThucEmail(input): Result<string, LoiEmail>` (`LoiEmail = \"rong\"|\"thieu_at\"|\"thieu_domain\"`) — viết assertion CHO CẢ BỐN khả năng (một `ok`, ba `loi` KHÁC NHAU) TRƯỚC, rồi cài đặt. `assertDeepEqual` (bài 2) dùng để so `Result` OBJECT toàn bộ, không CHỈ field `kind`."
  - so: 7
    slug: test-chuyen-trang-thai-hop-le
    title: "Test chuyển trạng thái HỢP LỆ — máy trạng thái là hàm thuần"
    teaches: [kt.test-valid-transitions]
    requires: [kt.test-result-branches]
    y_chinh: "`transition(trangThaiHienTai, suKien): KetQuaChuyen` (DU `{tag:\"ok\", trangThaiMoi} | {tag:\"loi\"}`) — MỘT hàm THUẦN, test GIỐNG HỆT mọi hàm thuần khác: input CỤ THỂ, output MONG ĐỢI, MỘT assertion mỗi cặp (trạng thái, sự kiện). Ví dụ đơn hàng: `\"nhap\"` + sự kiện `\"xac_nhan\"` → `\"cho_thanh_toan\"`. MỖI đường chuyển HỢP LỆ trong sơ đồ trạng thái LÀ MỘT assertion riêng, viết ĐỦ TRƯỚC khi tin cài đặt ĐÚNG."
  - so: 8
    slug: test-chuyen-trang-thai-tu-choi
    title: "Test chuyển trạng thái BỊ TỪ CHỐI — bao gồm trạng thái CUỐI"
    teaches: [kt.test-invalid-transitions]
    requires: [kt.test-valid-transitions]
    y_chinh: "QUAN TRỌNG NGANG bài trước: test các chuyển đổi KHÔNG hợp lệ PHẢI bị TỪ CHỐI (`tag: \"loi\"`) — ví dụ `\"nhap\"` KHÔNG thể nhảy THẲNG sang `\"da_giao\"` (bỏ qua các bước TRUNG GIAN). Trạng thái CUỐI (`\"da_huy\"`, `\"da_nhan\"`) PHẢI từ chối **MỌI** sự kiện — test riêng ĐIỀU đó, không GIẢ ĐỊNH \"không test lỗi thì chắc ổn\"."
  - so: 9
    slug: test-toan-bo-luong-su-kien
    title: "Test toàn bộ LUỒNG — phát lại một chuỗi sự kiện, kiểm trạng thái CUỐI"
    teaches: [kt.test-full-workflow]
    requires: [kt.test-invalid-transitions]
    y_chinh: "NGOÀI test TỪNG bước RIÊNG (bài 7-8), phát lại MỘT **CHUỖI** sự kiện qua `transition` (vòng lặp/`reduce`), kiểm trạng thái CUỐI CÙNG — \"integration test\" thu nhỏ nhưng VẪN thuần túy, VẪN đồng bộ. Ví dụ: `[\"xac_nhan\", \"thanh_toan\", \"giao_hang\", \"nhan_hang\"]` áp LÊN `\"nhap\"` phải kết thúc Ở `\"da_nhan\"`. Nếu MỘT sự kiện GIỮA chuỗi bị từ chối, chuỗi DỪNG Ở trạng thái TRƯỚC ĐÓ — kiểm cả case NÀY."
  - so: 10
    slug: tdd-may-trang-thai-tu-dau
    title: "Capstone: TDD một máy trạng thái MỚI từ đặc tả THUẦN VĂN BẢN"
    teaches: [kt.tdd-new-state-machine]
    requires: [kt.test-full-workflow]
    y_chinh: "Bài chốt cụm, code có chấm điểm sống: CHỈ với đặc tả THUẦN VĂN BẢN (đèn giao thông: `\"do\"` → `\"xanh\"` → `\"vang\"` → `\"do\"`, MỌI chuyển khác BỊ từ chối), học viên viết assertion (Đỏ) TRƯỚC, RỒI hàm `chuyenDen(trangThaiHienTai): Result<TrangThaiDen, \"khong_hop_le\">` (Xanh) — ghép TRỌN chu trình TDD (bài 1-9: Đỏ→Xanh, test nhánh hợp lệ+từ chối, test toàn bộ chu kỳ MỘT VÒNG) vào MỘT bài toán MỚI, chưa từng thấy."

# ── Cụm 3 (bài 11-14): FP DI & Test Craft — nguồn chương 31.4-31.5 ────────
  - so: 11
    slug: fp-di-fake-doi-tuong-thuan
    title: "FP DI: dependency là THAM SỐ, fake là OBJECT THUẦN"
    teaches: [kt.fp-di-fakes]
    requires: [kt.tdd-new-state-machine]
    y_chinh: "Thay vì thư viện MOCK, truyền dependency (`Deps`) NHƯ MỘT THAM SỐ object thường (FP DI, đã học T4.5's Reader-tương-tự) — \"fake\" phục vụ test CHỈ LÀ MỘT object literal THỰC HIỆN cùng interface, side-effect được GHI vào MỘT mảng THƯỜNG (đóng vai spy). `dangKyNguoiDung(deps, ten, email): Result<...>` với `deps: {timTheoEmail, luu}` — fake `timTheoEmail` trả CỨNG một giá trị GIẢ LẬP, `luu` chỉ `push` vào mảng `daLuu: [...]`, KHÔNG database THẬT nào."
  - so: 12
    slug: nha-may-tao-fake-cau-hinh-duoc
    title: "Nhà máy tạo fake CẤU HÌNH ĐƯỢC — mỗi test một bộ dữ liệu RIÊNG"
    teaches: [kt.fake-factory]
    requires: [kt.fp-di-fakes]
    y_chinh: "`taoFakeDeps(emailDaTonTai: string[] = []): Deps` — NHÀ MÁY tạo fake MỚI, CẤU HÌNH ĐƯỢC theo TỪNG kịch bản test (ví dụ: \"email NÀY đã tồn tại\" cho test trùng lặp, mảng RỖNG cho test đăng ký MỚI THÀNH CÔNG) — tránh CHIA SẺ state ĐỘT BIẾN giữa các test case (mỗi lời gọi `taoFakeDeps` TẠO Map/mảng RIÊNG, KHÔNG dùng LẠI của test TRƯỚC)."
  - so: 13
    slug: arrange-act-assert-va-dat-ten
    title: "Arrange-Act-Assert & đặt tên \"nên X khi Y\""
    teaches: [kt.aaa-naming]
    requires: [kt.fake-factory]
    y_chinh: "CẤU TRÚC MỖI test thành BA phần THẤY RÕ (Arrange — dựng dữ liệu/fake; Act — GỌI hàm CẦN test; Assert — kiểm kết quả) VÀ đặt tên MỖI assertion theo mẫu \"nên [kết quả] khi [điều kiện]\" — thất bại TỰ GIẢI THÍCH được, không cần đọc code MỚI hiểu ý định. Đối lập test \"vỡ mỗi lần refactor\" (kiểm CÁCH LÀM, ví dụ \"gọi ĐÚNG 3 hàm nội bộ theo thứ tự\") với test TỐT (kiểm KẾT QUẢ, sống sót QUA refactor — nối bài 5's bài học)."
  - so: 14
    slug: tdd-chuyen-tien-du-lieu-gia
    title: "Capstone: TDD chuyển tiền — FP DI + fake + AAA hợp lại"
    teaches: [kt.gate-boss-fp-di]
    requires: [kt.aaa-naming]
    y_chinh: "Bài chốt cụm, code có chấm điểm sống: `chuyenTien(kho, tuId, denId, soTien): Result<..., LoiChuyenTien>` (`LoiChuyenTien = \"khong_tim_thay_nguoi_gui\"|\"khong_tim_thay_nguoi_nhan\"|\"khong_du_so_du\"`) — dùng `Map` LÀM kho fake ĐỒNG BỘ (đã CHUYỂN từ async sang sync so với bản gốc sách — repository ĐỌC/GHI TRỰC TIẾP, không `Promise`), cấu trúc THEO Arrange-Act-Assert, MỌI assertion đặt tên \"nên X khi Y\", PHỦ đủ đường THÀNH CÔNG + BA nhánh lỗi — ghép TRỌN cụm 3 (FP DI, nhà máy fake, AAA/đặt tên) vào MỘT use case THẬT."

# ── Cụm 4 (bài 15-20): Property-Based Testing — Nền tảng — ch.32.1-32.2 ───
  - so: 15
    slug: vi-du-vs-tinh-chat
    title: "Test VÍ DỤ vs test TÍNH CHẤT — đoán input hay khẳng định bất biến"
    teaches: [kt.example-vs-property]
    requires: [kt.gate-boss-fp-di]
    y_chinh: "Test VÍ DỤ (đã làm xuyên suốt cụm 1-3): khẳng định MỘT cặp input→output CỤ THỂ — chỉ TỐT bằng SỰ SÁNG SUỐT của người chọn ví dụ. Test TÍNH CHẤT (Property-Based Testing): khẳng định MỘT BẤT BIẾN phải ĐÚNG với **RẤT NHIỀU** input NGẪU NHIÊN — bắt được edge case KHÔNG ai nghĩ tới liệt kê thủ công. Minh hoạ: `sapXep(mang)` — vài ví dụ TRÔNG ổn, NHƯNG chạy tính chất \"kết quả PHẢI có thứ tự tăng dần\" trên 50 mảng NGẪU NHIÊN mới THỰC SỰ tự tin."
  - so: 16
    slug: tu-viet-vong-lap-kiem-tinh-chat
    title: "Tự viết vòng lặp \"sinh rồi kiểm\" — cốt lõi của MỌI công cụ PBT"
    teaches: [kt.property-check-loop]
    requires: [kt.example-vs-property]
    y_chinh: "MỌI công cụ property-based testing (kể cả `fast-check` THẬT, không dùng được trong sandbox) quy VỀ ĐÚNG MỘT vòng lặp: SINH input ngẫu nhiên → KIỂM tính chất → BÁO lỗi Ở LẦN ĐẦU thất bại. `chayThuTinhChat(sinhInput, tinhChat, soLan)` — TỰ VIẾT vòng lặp ĐÓ TRƯỚC KHI đặt tên hoa mỹ gì cả, để THẤY nó ĐƠN GIẢN tới mức nào."
  - so: 17
    slug: kieu-bo-sinh-tu-che
    title: "Kiểu BoSinh<T> — bộ sinh dữ liệu ngẫu nhiên tự chế"
    teaches: [kt.arbitrary-type]
    requires: [kt.property-check-loop]
    y_chinh: "MỘT \"bộ sinh\" CHỈ LÀ `{generate: () => T}` — interface tối giản NÀY CHÍNH LÀ khái niệm \"Arbitrary\" của `fast-check`, tái tạo được TRONG MỘT DÒNG cho TỪNG kiểu. `soNguyen(min, max): BoSinh<number>` — `generate` dùng `Math.random()` + `Math.floor` để sinh số nguyên NGẪU NHIÊN TRONG khoảng."
  - so: 18
    slug: bo-sinh-mang-tong-quat
