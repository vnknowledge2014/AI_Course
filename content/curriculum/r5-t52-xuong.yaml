  - so: 20
    slug: kiem-tinh-chat-cho-dao-nguoc
    title: "Capstone: Kiểm BA tính chất của hàm đảo ngược mảng"
    teaches: [kt.gate-boss-pbt-foundations]
    requires: [kt.generic-property-runner]
    y_chinh: "Bài chốt cụm, code có chấm điểm sống: LẮP RÁP `BoSinh`/`mang`/`kiemTraTinhChat` (bài 17-19) để chứng minh `daoNguoc<A>(mang): readonly A[]` thoả BA tính chất ĐỘC LẬP: (1) đảo NGƯỢC HAI LẦN = mảng GỐC (đi-về), (2) độ DÀI GIỮ NGUYÊN, (3) mảng MỘT phần tử KHÔNG đổi. MỖI tính chất CHẠY qua `kiemTraTinhChat` TRÊN hàng chục mảng NGẪU NHIÊN — không phải MỘT ví dụ tay."

# ── Cụm 5 (bài 21-26): Mẫu tính chất & Shrinking — nguồn chương 32.3 ──────
  - so: 21
    slug: mau-bat-bien
    title: "Mẫu Bất Biến — điều PHẢI đúng, VÔ ĐIỀU KIỆN, với MỌI input"
    teaches: [kt.pattern-invariant]
    requires: [kt.gate-boss-pbt-foundations]
    y_chinh: "Mẫu tính chất THỨ NHẤT (trong bốn mẫu phổ biến): BẤT BIẾN — điều LUÔN LUÔN đúng, KHÔNG phụ thuộc input CỤ THỂ. Ví dụ: `Math.abs(n) >= 0` với MỌI `n`; `Math.abs(n) === Math.abs(-n)`. Ứng dụng: kiểm MỘT hàm `dieuChinhKhoangGiaTri` (clamp) LUÔN trả kết quả NẰM TRONG khoảng cho phép, BẤT KỂ input."
  - so: 22
    slug: mau-idempotent
    title: "Mẫu Idempotent — áp dụng HAI LẦN không khác áp dụng MỘT LẦN"
    teaches: [kt.pattern-idempotent]
    requires: [kt.pattern-invariant]
    y_chinh: "Mẫu THỨ HAI: `f(f(x)) === f(x)` — áp dụng hàm HAI LẦN KHÔNG làm gì THÊM so với áp dụng MỘT LẦN. Kinh điển cho hàm CHUẨN HOÁ (`chuanHoa`: trim + lowercase + gộp khoảng trắng) — chuẩn hoá dữ liệu ĐÃ chuẩn hoá PHẢI ra CHÍNH NÓ, KHÔNG BAO GIỜ đổi THÊM."
  - so: 23
    slug: mau-di-ve
    title: "Mẫu Đi-Về (Round-trip) — giải mã(mã hoá(x)) = x"
    teaches: [kt.pattern-round-trip]
    requires: [kt.pattern-idempotent]
    y_chinh: "Mẫu THỨ BA: `giaiMa(maHoa(x)) === x` — MÃ HOÁ rồi GIẢI MÃ phải TRẢ VỀ ĐÚNG dữ liệu GỐC. Minh hoạ bằng cipher Caesar-shift TỰ VIẾT (thay `Buffer`/base64, module Node không có trong sandbox) — `maHoa(chuoi, k)`/`giaiMa(chuoi, k)` qua `charCodeAt`/`fromCharCode`. Kiểm tính chất ĐI-VỀ trên hàng chục chuỗi NGẪU NHIÊN."
  - so: 24
    slug: mau-oracle
    title: "Mẫu Oracle — so sánh với cài đặt ĐÃ TIN CẬY"
    teaches: [kt.pattern-oracle]
    requires: [kt.pattern-round-trip]
    y_chinh: "Mẫu THỨ TƯ: so sánh cài đặt MỚI với MỘT \"oracle\" (nguồn ĐÃ tin cậy, ví dụ hàm CÓ SẴN của ngôn ngữ) THAY VÌ chọn GIÁ TRỊ kỳ vọng TAY. Ví dụ: TỰ VIẾT `canBacHaiCuaToi(n)` (Newton's method, vòng lặp xấp xỉ), SO SÁNH với `Math.sqrt(n)` (oracle) trên hàng chục số NGẪU NHIÊN, làm TRÒN để so sánh chấp nhận sai số nhỏ."
  - so: 25
    slug: tu-thu-nho-dau-vao-loi
    title: "Tự thu nhỏ đầu vào LỖI — shrinking, tìm ca THẤT BẠI TỐI GIẢN"
    teaches: [kt.hand-rolled-shrinking]
    requires: [kt.pattern-oracle]
    y_chinh: "Khi tính chất THẤT BẠI Ở một input NGẪU NHIÊN LỚN/PHỨC TẠP (ví dụ số `733`), THU NHỎ dần về giá trị NHỎ NHẤT/ĐƠN GIẢN NHẤT VẪN còn thất bại — debug DỄ HƠN NHIỀU với ca lỗi TỐI GIẢN thay vì số ngẫu nhiên bất kỳ. TỰ VIẾT `thuNhoSoNguyen(batDau, tinhChat)` — tìm kiếm nhị phân THU HẸP dần khoảng [đúng, sai] về TỐI GIẢN. Đây LÀ nội dung KHÔNG có trong sách nguồn (chỉ mô tả bằng LỜI) — TỰ THIẾT KẾ."
  - so: 26
    slug: kiem-tinh-chat-tra-ve-result
    title: "Capstone: Bộ kiểm tính chất TRẢ VỀ Result thay vì throw"
    teaches: [kt.gate-boss-pbt-patterns]
    requires: [kt.hand-rolled-shrinking]
    y_chinh: "Bài chốt cụm, code có chấm điểm sống: viết LẠI `kiemTraTinhChat` (bài 19) để TRẢ `Result<{soLanDung}, {input, viTri}>` THAY VÌ `console.log`/throw (nối phong cách track — Result ĐÃ HỌC, T4.5) — áp dụng vào tính chất ĐI-VỀ (bài 23) cho MỘT cặp `serialize`/`parse` số nguyên (`` `N:${n}` `` ↔ `Number(...)`). Ghép BỐN mẫu tính chất (bài 21-24) + Result-returning runner thành MỘT công cụ THỰC DỤNG, tái sử dụng được."

# ── Cụm 6 (bài 27-34): Kiểm thử đột biến — TỰ THIẾT KẾ, không nguồn sách ──
  - so: 27
    slug: dot-bien-la-gi
    title: "Đột biến là gì — cố ý gieo LỖI NHỎ, xem test có BẮT được không"
    teaches: [kt.mutation-testing-intro]
    requires: [kt.gate-boss-pbt-patterns]
    y_chinh: "Mutation testing: CỐ Ý sửa MỘT CHỖ NHỎ trong lời giải ĐÚNG (\"đột biến\" — mutant, ví dụ đổi `>` thành `>=`) rồi CHẠY LẠI bộ test HIỆN CÓ trên PHIÊN BẢN đột biến ĐÓ. Đột biến \"BỊ GIẾT\" nếu MỘT test THẤT BẠI (tốt — test THẬT SỰ phát hiện được sai khác); đột biến \"SỐNG SÓT\" nếu MỌI test VẪN qua (XẤU — bộ test KHÔNG THẬT SỰ kiểm điều ĐÓ, dù trông \"đủ\"). Minh hoạ: `laSoDuong(n) { return n > 0; }` với test CHỈ thử `n=5`/`n=-5` — đột biến đổi `>` thành `>=` (đổi Ý NGHĨA thành \"không âm\") VẪN QUA CẢ HAI test — bộ test trông \"ổn\" nhưng THỰC RA KHÔNG kiểm được ranh giới `n=0`."
  - so: 28
    slug: do-phu-vs-diem-dot-bien
    title: "Độ phủ dòng lệnh KHÁC điểm đột biến — CHẠY qua khác KIỂM ĐÚNG"
    teaches: [kt.coverage-vs-mutation-score]
    requires: [kt.mutation-testing-intro]
    y_chinh: "Độ phủ (code coverage): DÒNG code đó có ĐƯỢC CHẠY QUA hay không lúc test — 100% độ phủ CHỈ nghĩa là MỌI dòng CHẠY ÍT NHẤT một lần, KHÔNG nghĩa là KẾT QUẢ được KIỂM ĐÚNG. Điểm đột biến (mutation score): TỈ LỆ đột biến BỊ GIẾT trên TỔNG số đột biến thử — đo XEM test có THẬT SỰ kiểm đúng HÀNH VI hay không. Minh hoạ: MỘT test gọi `laSoDuong(5)` KHÔNG kiểm gì cả (`laSoDuong(5); // không assert`) — độ phủ dòng ĐẦY ĐỦ (dòng `return n > 0` ĐÃ chạy), NHƯNG MỌI đột biến ĐỀU sống sót (không assertion nào để BẮT sai khác) — điểm đột biến LÀ `0%`."
  - so: 29
    slug: dot-bien-ranh-gioi
    title: "Đột biến RANH GIỚI — < thành <=, > thành >=, off-by-one"
    teaches: [kt.mutation-boundary]
    requires: [kt.coverage-vs-mutation-score]
    y_chinh: "Loại đột biến PHỔ BIẾN VÀ QUAN TRỌNG NHẤT: đổi toán tử so sánh SÁT NGHĨA (`<`↔`<=`, `>`↔`>=`, `===`↔`!==`). CHỈ có test Ở ĐÚNG NGƯỠNG (giá trị BẰNG ranh giới) VÀ ngưỡng±1 mới GIẾT được loại đột biến NÀY — DÂY LÀ chính xác kỷ luật \"test ca biên\" ĐÃ ÁP DỤNG XUYÊN SUỐT dự án (được PHÁT HIỆN THẬT lúc viết T5.3/T5.6, ghi lại trong \"họ bẫy\" số 3). Bài tập: cho hàm `trongPham vi(n, min, max)` VÀ bộ test THIẾU ca biên, học viên THÊM test ĐỂ giết đột biến `<=`↔`<`."
  - so: 30
    slug: dot-bien-so-hoc
    title: "Đột biến SỐ HỌC — cộng thành trừ, nhân thành chia"
    teaches: [kt.mutation-arithmetic]
    requires: [kt.mutation-boundary]
    y_chinh: "Đổi toán tử số học (`+`↔`-`, `*`↔`/`) — NGUY HIỂM vì với GIÁ TRỊ NHỎ, kết quả đột biến ĐÔI KHI \"tình cờ\" giống kết quả ĐÚNG (PHÁT HIỆN THẬT tại T5.6 bài 22: `gioHienTai - t` đổi thành `gioHienTai + t` VẪN qua NẾU test CHỈ dùng timestamp NHỎ). GIẾT loại đột biến NÀY cần test dùng GIÁ TRỊ TUYỆT ĐỐI LỚN với HIỆU SỐ NHỎ (`-` cho kết quả NHỎ đúng, `+` cho kết quả LỚN sai lệch HẲN) — bài tập ÁP DỤNG TRỰC TIẾP kỹ thuật NÀY vào MỘT hàm tính \"tuổi\" (`gioHienTai - ngaySinh`)."
  - so: 31
    slug: dot-bien-logic
    title: "Đột biến LOGIC — && thành ||, phủ định bị XOÁ"
    teaches: [kt.mutation-logical]
    requires: [kt.mutation-arithmetic]
    y_chinh: "Đổi toán tử logic (`&&`↔`||`) hoặc XOÁ MỘT phủ định (`!dieuKien` → `dieuKien`) — GIẾT được CHỈ khi có test cho TỪNG TỔ HỢP giá trị boolean CỦA từng điều kiện con (đúng-đúng, đúng-sai, sai-đúng, sai-sai cho `&&`/`||` HAI điều kiện). Bài tập: hàm `duocPhepMua(coTien, duTuoi)` (`return coTien && duTuoi`) — bộ test CHỈ thử (true,true)/(false,false) BỎ SÓT hai tổ hợp CÒN LẠI, không giết được đột biến `&&`→`||`."
  - so: 32
    slug: dot-bien-hoan-doi-gia-tri
    title: "Đột biến HOÁN ĐỔI giá trị — field/hằng số cùng kiểu bị đổi chỗ"
    teaches: [kt.mutation-value-swap]
    requires: [kt.mutation-logical]
    y_chinh: "Đột biến hoán đổi HAI giá trị CÙNG KIỂU (hai field cùng string, hai chuỗi hardcode giữa hai hàm khác nhau) — PHÁT HIỆN THẬT hai lần: T5.3 bài 34 (mapper hai chiều hoán đổi `ma`↔`ten`, test chỉ kiểm MỘT field), T5.6 bài 16 (hai hàm build-query hoán đổi chuỗi SQL hardcode, test chỉ kiểm `params` không kiểm `sql`). GIẾT loại NÀY cần test kiểm GIÁ TRỊ RIÊNG của MỖI field/hằng số bằng DỮ LIỆU PHÂN BIỆT RÕ (không dùng giá trị GIỐNG NHAU cho hai vị trí lẽ ra PHẢI khác biệt được)."
  - so: 33
    slug: dot-bien-tuong-duong
    title: "Đột biến TƯƠNG ĐƯƠNG — thay đổi CÚ PHÁP, KHÔNG đổi HÀNH VI"
    teaches: [kt.equivalent-mutants]
    requires: [kt.mutation-value-swap]
    y_chinh: "GIỚI HẠN THÀNH THẬT của mutation testing: MỘT SỐ đột biến thay đổi CÚ PHÁP nhưng KHÔNG đổi HÀNH VI THẬT — gọi LÀ \"đột biến tương đương\" (equivalent mutant). Ví dụ: `n * 2` đổi thành `n + n` — về mặt TOÁN HỌC, GIỐNG HỆT NHAU với MỌI `n`, KHÔNG test NÀO (dù viết TỐT tới đâu) GIẾT được nó, VÀ ĐÓ HOÀN TOÀN KHÔNG PHẢI lỗi của bộ test. Nhận diện được đột biến TƯƠNG ĐƯƠNG (thay vì cố viết test VÔ VỌNG để giết nó) LÀ một kỹ năng THỰC TẾ — công cụ mutation testing THẬT (kể cả `tools/kiem_dot_bien.mjs` của DỰ ÁN NÀY) đều có \"danh sách miễn trừ\" cho trường hợp NÀY (`content/curriculum/dot-bien-bo-qua.yaml`)."
  - so: 34
    slug: san-dot-bien-that
    title: "BOSS — Săn đột biến THẬT: thêm test cho tới khi giết HẾT"
    teaches: [kt.gate-boss]
    requires: [kt.equivalent-mutants]
    y_chinh: "Bài BOSS của track: cho MỘT hàm `phanLoaiTuoi(tuoi): \"tre_em\"|\"thieu_nien\"|\"nguoi_lon\"` (ranh giới `<13`, `<18`, còn lại) VÀ một bộ test BAN ĐẦU CHỈ có BA ví dụ RÕ RÀNG (`5`→trẻ em, `15`→thiếu niên, `30`→người lớn) — hoàn toàn TRÔNG như \"đủ\" nhưng THỰC RA CHỨA NHIỀU đột biến SỐNG SÓT (ranh giới `13`/`18` chưa test, `<` có thể đổi `<=` mà không bị PHÁT HIỆN). Học viên PHẢI THÊM đủ test CA BIÊN (bài 29's kỹ thuật) để GIẾT HẾT đột biến ranh giới CÒN SỐNG — ghép TRỌN VẸN kỷ luật CẢ track (Đỏ-Xanh-Tinh gọn, test hàm thuần, property patterns, VÀ mutation testing) vào MỘT bài tập THỰC HÀNH cuối cùng, đúng NGUYÊN kỷ luật \"chấm trượt được đáp án sai\" ĐÃ DÙNG XUYÊN SUỐT DỰ ÁN NÀY."
