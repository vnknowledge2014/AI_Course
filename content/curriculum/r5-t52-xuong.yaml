# Xương sống R5.T5.2 — TDD→Property→Mutation (34 bài) — TypeScript
#
# Track THỨ BA của Realm 5 (Kỹ nghệ phần mềm), sau T5.3 (DDD, 42/42) và T5.6
# (Bảo mật ứng dụng, 26/26). T5.2 được chọn TIẾP THEO vì HAI PHẦN BA có nguồn
# tham khảo trực tiếp trong `fp/TypeScript_Books/part_6_testing_fullstack/`:
#   - chapter_31_tdd_typescript.md (600 dòng) — TDD cycle, domain logic, FP DI
#   - chapter_32_property_based_testing.md (355 dòng) — Property-based testing
# Cả hai đã đọc TOÀN BỘ qua 2 agent phân tích song song (2026-09-02).
#
# PHẦN BA "Mutation" KHÔNG CÓ nguồn sách (đã grep TOÀN BỘ fp/TypeScript_Books,
# fp/Python_Books, fp/Rust_Books — không chương nào nhắc "mutation testing"/
# "stryker") — cụm 6 (bài 27-34) là nội dung TỰ THIẾT KẾ, dựa TRỰC TIẾP trên
# kỷ luật mutation-testing DỰ ÁN NÀY đã dùng THẬT xuyên suốt T5.3+T5.6 (công
# cụ `tools/kiem_dot_bien.mjs`, TÁM họ bẫy đã phát hiện thật, ghi trong
# HANDOFF) — nguồn tư liệu THẬT, không phải hư cấu, chỉ là KHÔNG phải một
# chương sách có sẵn để "đọc và chuyển thể".
#
# QUYẾT ĐỊNH KHÔNG DÙNG THƯ VIỆN (giống T4.3/T4.5/T5.3/T5.6): CẢ HAI chương
# nguồn dùng `import assert from "node:assert/strict"` (module Node, không
# có trong sandbox) — thay bằng hàm TỰ VIẾT `assertEqual`/`assertDeepEqual`
# (dạy Ở BÀI 2, dùng lại XUYÊN SUỐT track). Chương 31's `Vitest` (cài đặt,
# `describe`/`it`) và chương 32's `fast-check` (`fc.assert`, `fc.property`)
# CHỈ xuất hiện dưới dạng comment/pseudocode trong CHÍNH sách nguồn (tác giả
# đã viết sao cho code THỰC THI luôn tự đủ, không phụ thuộc thư viện ngoài)
# — giữ NGUYÊN tinh thần đó, KHÔNG BAO GIỜ import thật.
#
# BẪY SANDBOX ĐÃ BIẾT, ÁP DỤNG LẠI: KHÔNG async/await/Promise/.then()/
# setTimeout. Chương 31's `registerUser`/bài tập `transfer` VỐN DĨ async
# (repository trả `Promise`) — ĐÃ CHUYỂN sang ĐỒNG BỘ (repo trả giá trị
# TRỰC TIẾP, không `Promise`) khi thiết kế xương NÀY, không đổi Ý NGHĨA
# nghiệp vụ. Chương 32's `Buffer.from(...).toString("base64")` (Node global)
# → thay bằng cipher Caesar-shift TỰ VIẾT (`charCodeAt`/`fromCharCode`).
#
# TÁI DÙNG THẲNG Result<T,E> TỪ T4.5 (giống T5.3/T5.6): mọi ví dụ test hàm
# trả lỗi dùng shape ĐÃ CÓ `{kind:"ok"|"loi", giaTri, loi}` — KHÔNG dạy lại
# composition theory.
#
# world: blueprint-board (sum type hở → bug BÒ RA — MASTERPLAN §R5)
# skill namespace: kt.* (Kiểm Thử) — namespace MỚI, không trùng
# ddd.*/bmud.*/ts.*/alg.* đã dùng ở R4/T5.3/T5.6.

cum:
  - so: 1
    ten: "Chu trình TDD — Nền tảng"
    tom_tat: "Red-Green-Refactor, tự viết assert (không thư viện), Red rồi Green trên hàm thuần, biên có ý thức, capstone tinh gọn không đổi hành vi."
  - so: 2
    ten: "Test Domain Logic"
    tom_tat: "Test hàm trả Result, chuyển trạng thái hợp lệ/bị từ chối, toàn bộ luồng sự kiện, capstone xây máy trạng thái mới từ đặc tả."
  - so: 3
    ten: "FP DI & Test Craft"
    tom_tat: "Dependency injection kiểu FP, fake object thuần, nhà máy tạo fake cấu hình được, Arrange-Act-Assert + đặt tên, capstone chuyển tiền dùng fake."
  - so: 4
    ten: "Property-Based Testing — Nền tảng"
    tom_tat: "Ví dụ vs tính chất, tự viết vòng lặp kiểm tính chất, kiểu Bộ Sinh tự chế, bộ sinh mảng tổng quát, hàm kiểm tra tổng quát, capstone kiểm ba tính chất của đảo ngược."
  - so: 5
