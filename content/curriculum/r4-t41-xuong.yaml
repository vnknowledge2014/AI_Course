    y_chinh: "Thay vì hàm TỰ GỌI `random`/`datetime.now()` bên trong, TRUYỀN chúng vào như THAM SỐ: `def chao(ten, gio=lambda: 'sáng'): return f'Chào {gio()}, {ten}!'` — hàm giờ THUẦN theo đúng nghĩa: với CÙNG `ten` và CÙNG hàm `gio`, luôn CÙNG kết quả. 'Không tất định' bị đẩy RA NGOÀI, không biến mất — ai gọi hàm quyết định dùng giờ thật hay giờ giả (test dùng giờ giả, sản phẩm dùng giờ thật). Code chấm điểm sống."
  - so: 11
    slug: kiem-thuan-khiet-bang-goi-hai-lan
    title: "Kiểm một hàm có thuần không: gọi HAI LẦN, so kết quả"
    teaches: [fp.test-purity]
    requires: [fp.dependency-injection]
    y_chinh: "`assert f(2, 3) == f(2, 3)` — không chứng minh được TUYỆT ĐỐI (một hàm có thể tình cờ ra cùng kết quả hai lần mà vẫn không thuần), nhưng là phép kiểm THỰC TẾ nhanh nhất. Code chấm điểm sống dùng `tier: static` với `pure-fn` (đã đo thật: bắt global/nonlocal, gọi IO, gọi random/datetime.now, sửa dữ liệu tại chỗ TRONG THÂN hàm — KHÔNG chứng minh được purity qua hàm gọi gián tiếp, nói rõ giới hạn này nếu bài nhắc tới) KẾT HỢP với test gọi hai lần — hai lớp bổ sung nhau, không lớp nào một mình đủ."
