    teaches: [fp.io-is-side-effect]
    requires: [fp.nondeterministic-impure]
    y_chinh: "Side-effect không chỉ là 'sửa dữ liệu tại chỗ' (cụm 1) — bất kỳ TÁC ĐỘNG NÀO ra thế giới bên ngoài lời gọi hàm (in ra màn hình, ghi file, gọi mạng) đều là side-effect, kể cả khi hàm KHÔNG sửa list/dict nào cả. `def chao(ten): print(f'Chào {ten}')` — không sửa gì, vẫn không thuần, vì gọi hai lần với CÙNG `ten` gây ra HAI LẦN in (một tác động lặp lại không mong muốn nếu gọi nhầm hai lần). Bài predict: phân biệt 'không sửa dữ liệu' với 'không thuần' — hai điều khác nhau."
