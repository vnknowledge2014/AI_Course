# ── Cụm 4 (bài 19–24): Trạng thái bất biến + chốt track ───────────────────
  - so: 19
    slug: trang-thai-la-du-lieu
    title: "Trạng thái LÀ dữ liệu — chuyển trạng thái LÀ một hàm"
    teaches: [fp.state-as-data]
