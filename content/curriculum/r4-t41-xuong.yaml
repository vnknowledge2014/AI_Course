# Xương sống R4.T4.1 — Bất biến & thuần khiết (24 bài)
#
# Track FP THẬT ĐẦU TIÊN của Realm 4 (T4.0a/T4.0b chỉ là CỔNG ngôn ngữ,
# chưa dạy khái niệm FP nào). Dùng lại Python — không phải ngôn ngữ mới,
# không cần "đo năng lực engine" như T4.0a/T4.0b, nhưng CẦN vá hạ tầng
# trước: sáu AST-kind Realm 4 (`frozen-dataclass`, `no-mutation`, `no-global`,
# `uses-generator`, `recursion`, `pure-fn`) đã cài trong
# `packages/exec-python/src/kiem-ast.ts` (commit ngay trước xương này) —
# ĐỌC comment trong file đó để biết chính xác mỗi kind bắt được gì và KHÔNG
# bắt được gì trước khi dùng `tier: static` với chúng.
#
# Ý XUYÊN SUỐT: không sửa dữ liệu TẠI CHỖ — luôn TẠO MỚI; một hàm không có
# side-effect luôn cho CÙNG input ra CÙNG output. Đây là hệ quả tự nhiên của
# chính vấn đề T3.1 đã dựng: mem.name-is-reference + mem.aliasing-explained
# dạy "nhiều tên có thể cùng trỏ một giá trị" — track này dạy KỶ LUẬT đối
# phó với hệ quả đó (một hàm sửa giá trị tại chỗ làm MỌI tên đang trỏ tới nó
# đều thấy thay đổi, kể cả những tên không ngờ tới).
#
# NGUỒN THAM KHẢO (chỉ đọc, KHÔNG sửa):
# `fp/Python_Books/part_2_thinking_functionally/chapter_11_immutability_purity.md`
# — bốn kỹ thuật bất biến (`frozen=True`, `tuple`, `Final`, `MappingProxyType`),
# pure function, dependency injection, state machine bất biến. Xương dưới
# đây MỞ RỘNG một chương thành 24 bài có nhịp byte/explain/example/predict/
# code/reflect — KHÔNG chép nguyên văn, chỉ mượn Ý và ví dụ gốc (bài tập
# "refactor hàm impure" ở cuối chương gốc → bài 22 dưới đây).
#
# `Final` (typing) KHÔNG xuất hiện trong track này: đó là tín hiệu cho công
# cụ kiểm kiểu TĨNH (mypy) — Pyodide/kiem_ma_bai_hoc.mjs không chạy mypy,
# và Python KHÔNG tự chặn gán lại một biến `Final` lúc chạy (đã đo thật:
# gán lại một tên có annotate `Final` chạy trót lọt, không lỗi). Dạy nó như
# một cơ chế "chặn được" ở đây sẽ là dạy sai — nói thẳng trong bài nếu nhắc
# tới, đừng bịa một khối code "chặn Final" không chạy thật.
#
# Bốn cơ chế CÒN LẠI ĐÃ ĐO THẬT qua Pyodide (packages/exec-python), khớp
# đúng CPython — dùng được cho code chấm điểm sống:
#   - `@dataclass(frozen=True)`: sửa field → `dataclasses.FrozenInstanceError`
#   - `tuple`: `.append()` → `AttributeError` (không có phương thức đó)
#   - `frozenset`: `.add()` → `AttributeError`
#   - `types.MappingProxyType`: gán vào ô → `TypeError`
#   - BẪY đã đo: `@dataclass(frozen=True)` chỉ chặn GÁN LẠI field, KHÔNG
#     chặn sửa một đối tượng MUTABLE nằm BÊN TRONG field đó
#     (`b.items.append(4)` với `items: list` chạy trót lọt, không lỗi) —
#     bài 15 dạy đúng bẫy này.
#
# Namespace skill: `fp.*`. Thư mục nội dung:
# `content/lap-trinh-ham/02-bat-bien-thuan-khiet/` (số `02`, tiếp sau
# `01-cong-rust` — track này KHÔNG phải "T4.2", vẫn là T4.1 theo MASTERPLAN,
# số thư mục chỉ là thứ tự, không phải số hiệu track).

