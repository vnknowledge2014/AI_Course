    slug: alerting-vuot-nguong-sinh-canh-bao
    title: "Alerting — khi metric VƯỢT ngưỡng, sinh CẢNH BÁO"
    teaches: [vh.alerting-threshold]
    requires: [vh.health-check-dependencies]
    y_chinh: "Alerting = SO SÁNH metric (bài 13-16) VỚI ngưỡng ĐÃ định TRƯỚC, sinh MỘT cảnh báo NẾU vượt. `kiemTraCanhBao(tyLeLoi: number, nguong: number): {canhBao: boolean, thongDiep: string}` — RANH GIỚI: vượt QUÁ ngưỡng (`>`, KHÔNG `>=`) mới cảnh báo (nối TRỰC TIẾP kỷ luật \"ranh giới CHÍNH XÁC\" ĐÃ dùng T5.4 bài 24 cho tồn kho)."
  - so: 20
    slug: capstone-trace-health-check
