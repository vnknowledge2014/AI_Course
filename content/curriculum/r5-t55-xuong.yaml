    teaches: [vh.gate-boss-observability]
    requires: [vh.observability-feedback-loop]
    y_chinh: "Bài BOSS của track: MỘT \"trung tâm vận hành\" nhỏ HOÀN CHỈNH — GHÉP TOÀN BỘ SÁU cụm vào MỘT kịch bản: (1) `chayPipelineCI` (cụm 1) QUYẾT ĐỊNH deploy ĐƯỢC hay KHÔNG; (2) deploy THÀNH CÔNG GHI log CÓ CẤU TRÚC (cụm 3); (3) MỘT loạt request SAU deploy sinh metrics (cụm 4); (4) `vongQuanSat` (bài 23) ĐỌC metrics, sinh CẢNH BÁO nếu CẦN, tra RUNBOOK (cụm 6) — MỘT bài THỰC HÀNH ghép TRỌN VẸN kỷ luật \"đo trước khi viết\" ĐÃ DÙNG XUYÊN SUỐT DỰ ÁN NÀY vào MỘT hệ vận hành GIẢ LẬP, mastery=0.85 (BOSS track — reflect LÀ tổng kết, KHÔNG PHẢI câu hỏi bắc cầu)."
