    teaches: [vh.gate-boss-tracing-health]
    requires: [vh.alerting-threshold]
    y_chinh: "Bài chốt cụm, code có chấm điểm sống: ghép `Span`/`timBuocChamNhat` (bài 17) VỚI `kiemTraSucKhoe` (bài 18) — mô phỏng MỘT request ĐI qua BA bước (MỘT bước CHẬM BẤT THƯỜNG) ĐỒNG THỜI kiểm tra SỨC KHOẺ của HAI dependency (MỘT `khoe`, MỘT `om`) — kiểm CẢ việc tìm ĐÚNG bước chậm NHẤT LẪN việc BÁO \"om\" khi CÓ dependency hỏng."

# ── Cụm 6 (bài 21-24): Alerting & Vận hành — BOSS — TỰ THIẾT KẾ ─────────
  - so: 21
    slug: sli-slo-va-error-budget
    title: "SLI/SLO — chỉ số ĐO ĐƯỢC vs mục tiêu CAM KẾT, error budget"
    teaches: [vh.sli-slo-error-budget]
    requires: [vh.gate-boss-tracing-health]
    y_chinh: "SLI (Service Level Indicator) = con số ĐO ĐƯỢC THẬT (ví dụ: tỉ lệ request THÀNH CÔNG). SLO (Service Level Objective) = mục tiêu CAM KẾT cho SLI ĐÓ (ví dụ: \"99% request THÀNH CÔNG\"). Error budget = \"NGÂN SÁCH lỗi\" CÒN LẠI trước khi VI PHẠM SLO — `tinhErrorBudget(sliHienTai: number, slo: number): number` = `sliHienTai - slo` (DƯƠNG nghĩa LÀ CÒN DƯ, ÂM nghĩa LÀ ĐÃ VI PHẠM)."
  - so: 22
    slug: runbook-alert-den-hanh-dong
    title: "Runbook — khi cảnh báo kích hoạt, PHẢN ỨNG có CẤU TRÚC"
    teaches: [vh.runbook-alert-to-action]
    requires: [vh.sli-slo-error-budget]
    y_chinh: "MỘT cảnh báo (bài 19) KHÔNG TỰ nó GIẢI QUYẾT gì — cần MỘT \"runbook\" (ÁNH XẠ từ LOẠI cảnh báo SANG hành động CỤ THỂ, KHÔNG PHẢI hoảng loạn TUỲ HỨNG). `LoaiCanhBao = \"ty_le_loi_cao\" | \"dependency_hong\" | \"do_tre_cao\"` (Discriminated Union), `layHanhDong(loai: LoaiCanhBao): string` — exhaustive `switch`, MỖI loại CẢNH BÁO ÁNH XẠ MỘT hành động RÕ RÀNG."
  - so: 23
    slug: tong-hop-mot-vong-vong-vong-quan-sat
