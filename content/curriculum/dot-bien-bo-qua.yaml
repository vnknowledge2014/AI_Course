# Đột biến được tha, kèm lý do
#
# `tools/kiem_dot_bien.mjs` sửa một Ý trong phần người học phải điền rồi hỏi
# cách chấm có bắt được không. Bắt không được thì hoặc cách chấm hổng, hoặc
# đột biến ấy vô hại. Tệp này khai loại thứ hai — TỪNG CÁI MỘT, kèm lý do.
#
# Khai bừa vào đây để cổng xanh là tự tay dựng lại đúng thứ cả dự án đi bắt:
# một con số xanh không đo thứ nó nói là nó đo. Mỗi dòng dưới đây phải trả lời
# được câu "vì sao đáp án ấy KHÔNG phải là đáp án sai".
#
# Một điều rút ra từ vòng phân loại đầu tiên, đáng ghi lại: phần lớn ngưỡng ở
# Realm 0 và Realm 1 không kiểm được chỗ hoà, vì bài chấm mã viết thẳng trên
# ĐÚNG MỘT bộ dữ liệu cố định. Muốn kiểm chỗ hoà thì hoặc đổi dữ liệu (kéo
# theo mọi bài dùng chung sổ ấy), hoặc gói việc vào một hàm rồi gọi nhiều lần
# — mà hàm là khái niệm của T1.3, tới sau. Từ T1.3 trở đi thì không còn cớ ấy.

