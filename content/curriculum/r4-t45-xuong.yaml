# ── Cụm 1 (bài 1–7): Monoid — kết hợp hai giá trị CÙNG LOẠI ───────────────
bai:
  - so: 1
    slug: nhieu-phep-cong-mot-khuon-chung
    title: "Cộng số, nối chuỗi, gộp mảng — MỘT khuôn chung ẩn bên dưới"
    teaches: [alg.spot-the-pattern]
    requires: [fp.reduce-basics]
    y_chinh: "`1 + 2`, `\"a\" + \"b\"`, `[1,2].concat([3,4])` — ba phép toán TRÔNG khác hẳn nhau (số, chuỗi, mảng), nhưng CÙNG hình dạng: nhận HAI giá trị CÙNG KIỂU, trả về MỘT giá trị CÙNG KIỂU ĐÓ. Bài dựng vấn đề bằng cách xếp ba ví dụ cạnh nhau — chưa đặt tên khái niệm, chỉ cho THẤY khuôn lặp lại."
  - so: 2
    slug: gia-tri-trung-tinh-khong-doi-gi-ca
    title: "Giá trị TRUNG TÍNH — kết hợp với nó, không đổi gì cả"
    teaches: [alg.identity-element]
    requires: [alg.spot-the-pattern]
    y_chinh: "`5 + 0 === 5`, `\"chao\" + \"\" === \"chao\"`, `[1,2].concat([]) `giữ nguyên `[1,2]`` — mỗi phép kết hợp ở bài 1 có MỘT giá trị ĐẶC BIỆT: kết hợp với nó (dù bên trái hay bên phải) không đổi gì. `0` cho cộng, `\"\"` cho nối chuỗi, `[]` cho gộp mảng — BA giá trị khác nhau, CÙNG một vai trò: 'trung tính', không phải trùng hợp."
  - so: 3
    slug: dinh-nghia-monoid-ket-hop-va-trung-tinh
    title: "Định nghĩa `Monoid` — một cặp: cách KẾT HỢP, và giá trị TRUNG TÍNH"
    teaches: [alg.monoid-interface]
    requires: [alg.identity-element]
    y_chinh: "`interface Monoid<T> { ketHop: (a: T, b: T) => T; rong: T }` — một object TypeScript ghi lại ĐÚNG hai thứ bài 1-2 đã thấy: hàm kết hợp, và giá trị trung tính. `const monoidCong: Monoid<number> = { ketHop: (a,b) => a+b, rong: 0 }` — ĐÃ ĐO THẬT. Không phải khái niệm mới — chỉ ĐẶT TÊN HÌNH THỨC cho khuôn bài 1-2 đã lặp lại."
  - so: 4
    slug: gop-mot-mang-bang-monoid-va-reduce
    title: "Gộp MỘT MẢNG giá trị bằng Monoid — nối thẳng `reduce`"
    teaches: [alg.concat-all-via-reduce]
    requires: [alg.monoid-interface]
    y_chinh: "`function gopTatCa<T>(m: Monoid<T>, ds: T[]): T { return ds.reduce(m.ketHop, m.rong); }` — ĐÃ ĐO THẬT, dùng CHUNG một hàm `gopTatCa` cho `monoidCong` (`[1,2,3,4]` → `10`) VÀ `monoidNoiChuoi` (`[\"a\",\"b\",\"c\"]` → `\"abc\"`). Nối thẳng T4.2's `reduce` (bài 9-10) — `m.rong` CHÍNH LÀ `khoi_dau`, `m.ketHop` CHÍNH LÀ hàm gộp. Đại số không thay thế `reduce` — nó cho `reduce` một BỘ THAM SỐ có tên, tái dùng được."
  - so: 5
    slug: mang-rong-van-ra-dung-gia-tri-trung-tinh
    title: "Mảng RỖNG vẫn ra đúng — nhờ giá trị trung tính"
    teaches: [alg.empty-array-needs-identity]
    requires: [alg.concat-all-via-reduce]
    y_chinh: "`gopTatCa(monoidCong, [])` phải ra `0`, không phải lỗi hay `undefined` — ĐÃ ĐO THẬT. Đây là LÝ DO `rong` phải có mặt trong `Monoid` (không chỉ `ketHop`): `reduce` với mảng rỗng KHÔNG có phần tử nào để gộp, phải bắt đầu từ ĐÂU ĐÓ — `rong` là điểm bắt đầu ĐÚNG, không làm lệch kết quả dù mảng rỗng hay không."
  - so: 6
    slug: tu-viet-mot-monoid-moi
    title: "Tự viết một `Monoid` MỚI"
    teaches: [alg.write-monoid]
    requires: [alg.empty-array-needs-identity]
    y_chinh: "Bài code có chấm điểm sống: viết `monoidNhan: Monoid<number>` (kết hợp bằng phép NHÂN, không phải cộng) — điểm khó: giá trị `rong` phải là `1` (KHÔNG phải `0` — nhân với `0` sẽ luôn ra `0`, phá mọi phép nhân), đúng bài học 'giá trị trung tính phải ĐÚNG với phép kết hợp cụ thể', không có công thức chung cho mọi Monoid."
  - so: 7
    slug: do-tong-hop-monoid
    title: "Đo tổng hợp: Monoid"
    teaches: [alg.review-monoid]
    requires: [alg.write-monoid]
    y_chinh: "Bài chốt cụm, code có chấm điểm sống: viết MỘT `Monoid` MỚI (khác cộng/nhân/nối chuỗi đã dùng — ví dụ `Monoid<boolean>` kết hợp bằng `&&`, `rong = true`) VÀ dùng `gopTatCa` với nó. Không khái niệm mới — đo khả năng tự NHẬN RA một phép kết hợp có phải Monoid không, và tìm ĐÚNG giá trị trung tính của nó."

# ── Cụm 2 (bài 8–13): Option & Result tự viết — vật liệu cho các cụm sau ──
  - so: 8
    slug: gia-tri-co-the-vang-mat-khong-dung-null
    title: "Giá trị CÓ THỂ VẮNG MẶT — không dùng `null`/`undefined`"
    teaches: [alg.avoid-null-motivation]
    requires: [ts.adt-gate-boss]
    y_chinh: "Nhớ lại T4.0a's `ts.possibly-undefined`: `undefined` LẶN vào bất kỳ đâu, dễ quên kiểm. T4.3 đã dạy discriminated union mô hình hoá 'nhiều hình dạng' rõ ràng — bài này áp dụng ĐÚNG kỹ năng đó cho một vấn đề CŨ: 'giá trị có thể có, có thể không' KHÔNG cần `null`, dùng một ADT tường minh thay thế."
  - so: 9
    slug: tu-viet-option-co-hoac-khong
    title: "Tự viết `Option<T>` — `\"co\"` hoặc `\"khong\"`"
    teaches: [alg.option-type]
    requires: [alg.avoid-null-motivation]
    y_chinh: "`type Option<T> = { kind: \"co\"; giaTri: T } | { kind: \"khong\" }` cùng hai hàm dựng `co<T>(giaTri: T): Option<T>` và `khong<T>(): Option<T>` — ĐÃ ĐO THẬT, generic unify đúng (khác byte-rust — TypeScript thật không có bất đối xứng đó). Đây CHÍNH LÀ discriminated union T4.3 đã dạy, không khái niệm hạ tầng mới — chỉ một CÁCH DÙNG mới: thay `null`."
  - so: 10
    slug: pattern-match-tren-option
    title: "`switch` trên `Option` — đúng kỷ luật exhaustiveness đã học"
    teaches: [alg.pattern-match-option]
    requires: [alg.option-type]
    y_chinh: "`switch (o.kind) { case \"co\": ...o.giaTri...; case \"khong\": ... }` — nối thẳng T4.3's cụm 2 (exhaustiveness). Bài predict: quên nhánh `\"khong\"` không có `default`/`assertNever` thì TypeScript có báo lỗi không (không — đúng lỗi bài 7 T4.3 đã dạy, `switch` không tự đòi xử lý đủ nếu không có assertNever)."
  - so: 11
    slug: tu-viet-result-thanh-cong-hoac-loi
    title: "Tự viết `Result<T, E>` — thành công hoặc lỗi CÓ LÝ DO"
    teaches: [alg.result-type]
    requires: [alg.pattern-match-option]
    y_chinh: "`type Result<T, E> = { kind: \"ok\"; giaTri: T } | { kind: \"loi\"; loi: E }` cùng `ok<T,E>`/`loi<T,E>` — ĐÃ ĐO THẬT. Khác `Option` (chỉ nói 'có/không', không giải thích TẠI SAO không có), `Result` MANG THEO lý do lỗi trong biến thể `\"loi\"` — chọn `Option` hay `Result` tuỳ: có cần GIẢI THÍCH lý do vắng mặt hay không."
  - so: 12
    slug: khi-nao-dung-option-khi-nao-dung-result
    title: "Khi nào dùng `Option`, khi nào dùng `Result`"
    teaches: [alg.option-vs-result]
    requires: [alg.result-type]
    y_chinh: "Bài LÝ THUYẾT: tìm một phần tử trong mảng theo điều kiện → `Option` (không tìm thấy không cần LÝ DO, chỉ cần biết 'không có'). Chuyển chuỗi thành số → `Result` (chuyển thất bại thì NGƯỜI DÙNG cần biết TẠI SAO — chuỗi rỗng? ký tự không phải số?). Không có câu trả lời máy móc — phụ thuộc: lỗi có cần GIẢI THÍCH được cho người dùng không."
  - so: 13
    slug: do-tong-hop-option-result
    title: "Đo tổng hợp: `Option` & `Result` tự viết"
    teaches: [alg.review-option-result]
    requires: [alg.option-vs-result]
    y_chinh: "Bài chốt cụm, code có chấm điểm sống: viết một hàm dùng `Option` (tìm số CHẴN đầu tiên trong mảng, không có LÝ DO cụ thể khi không tìm thấy) VÀ một hàm dùng `Result` (chuyển chuỗi thành số nguyên, LỖI ghi rõ chuỗi gốc). Không khái niệm mới — đo khả năng CHỌN ĐÚNG kiểu ADT theo ngữ cảnh."

# ── Cụm 3 (bài 14–20): Functor — `.map()` tổng quát hoá ───────────────────
  - so: 14
    slug: viet-map-rieng-cho-option
    title: "Viết `map` RIÊNG cho `Option`"
    teaches: [alg.map-option-handwritten]
    requires: [alg.review-option-result]
    y_chinh: "`function mapOption<T,U>(o: Option<T>, f: (x: T) => U): Option<U> { switch (o.kind) { case \"co\": return co(f(o.giaTri)); case \"khong\": return khong(); } }` — ĐÃ ĐO THẬT. Nếu `Option` 'có', áp dụng `f` lên giá trị BÊN TRONG, giữ nguyên vỏ `Option`; nếu 'không', giữ nguyên 'không', KHÔNG gọi `f`."
  - so: 15
    slug: viet-map-rieng-cho-result
    title: "Viết `map` RIÊNG cho `Result` — CÙNG khuôn"
    teaches: [alg.map-result-handwritten]
    requires: [alg.map-option-handwritten]
    y_chinh: "`function mapResult<T,U,E>(r: Result<T,E>, f: (x: T) => U): Result<U,E> { ... }` — ĐÃ ĐO THẬT. So `mapOption` với `mapResult` cạnh nhau: CÙNG cấu trúc hệt nhau (nếu 'thành công', áp dụng f bên trong, giữ vỏ; nếu 'lỗi', giữ nguyên lỗi) — chỉ khác TÊN biến thể (`co`/`khong` vs `ok`/`loi`)."
  - so: 16
    slug: array-map-cung-la-cung-khuon
    title: "`Array.prototype.map` CŨNG là cùng khuôn — bạn đã dùng nó từ T4.2"
    teaches: [alg.array-map-same-pattern]
    requires: [alg.map-result-handwritten]
    y_chinh: "`[1,2,3].map(x => x * 2)` — ĐÃ ĐO THẬT, nhìn lại với con mắt mới: nếu mảng CÓ phần tử, áp dụng `f` lên TỪNG phần tử, giữ nguyên 'vỏ' (vẫn là một mảng, cùng số lượng); mảng RỖNG map ra mảng RỖNG (giữ nguyên vỏ, không gọi f lần nào). CÙNG khuôn `mapOption`/`mapResult` — track T4.2 đã dùng khuôn này SUỐT mà chưa đặt tên."
  - so: 17
    slug: dat-ten-functor-bat-ky-hop-chua-co-map-dung-luat
    title: "Đặt tên: `Functor` — bất kỳ 'hộp chứa' có `map` đúng luật"
    teaches: [alg.functor-definition]
    requires: [alg.array-map-same-pattern]
    y_chinh: "`Option`, `Result`, `Array` — BA kiểu dữ liệu khác hẳn nhau, CÙNG có một hàm `map` cùng hình dạng: 'áp dụng f lên giá trị bên trong, giữ nguyên hình dạng bên ngoài'. Bất kỳ kiểu nào có `map` như vậy được gọi là một **Functor**. Không phải một kiểu dữ liệu CỤ THỂ — một TÍNH CHẤT mà nhiều kiểu dữ liệu khác nhau CÙNG có."
  - so: 18
    slug: luat-functor-mot-map-id-khong-doi-gi
    title: "Luật Functor 1: `map(id)` không đổi gì cả"
    teaches: [alg.functor-law-identity]
    requires: [alg.functor-definition]
    y_chinh: "`mapOption(co(5), x => x)` phải ra ĐÚNG `co(5)` — ĐÃ ĐO THẬT. `x => x` (hàm 'giữ nguyên', gọi là `id`) áp dụng qua `map` thì KHÔNG được đổi gì — nếu một hàm `map` tự chế phá luật này (ví dụ âm thầm nhân đôi giá trị), nó KHÔNG PHẢI một Functor hợp lệ, dù cú pháp trông giống. Bài predict: một `map` VIẾT SAI (cố ý có side effect) có tuân luật này không."
  - so: 19
    slug: luat-functor-hai-ghep-hai-map-bang-mot-map-ghep
    title: "Luật Functor 2: ghép hai `map` bằng MỘT `map` đã ghép hàm"
