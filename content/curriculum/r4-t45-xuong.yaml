# Xương sống R4.T4.5 — Đại số của chương trình (54 bài)
#
# Track LỚN NHẤT Realm 4. T4.4 (Generics/Traits, Rust) bị HOÃN — xem
# `docs/decisions/R4-T44-generics-traits-do-duoc.md` (trait bound không parse
# được trong byte-rust, cần ~5.000 dòng hạ tầng chưa đầu tư). Track này quay
# lại TypeScript, tiếp nối T4.3 (ADT & Pattern Matching) — KHÔNG phụ thuộc
# byte-rust, không bị chặn bởi quyết định hoãn đó.
#
# MASTERPLAN §1272 ghi đúng một dòng cho track này: "Đại số của chương trình
# (54) [TS] ← Monoid→Functor→Applicative→Monad→Traverse→Cata". Sáu khái niệm
# đó là ĐẠI SỐ TRỪU TƯỢNG — tồn tại độc lập với TypeScript (có ở Haskell,
# Scala, Rust, mọi ngôn ngữ FP) — track này DẠY chúng BẰNG TypeScript, không
# dạy "TypeScript's Monoid API" (không có API nào như vậy có sẵn). Namespace
# skill dùng `alg.*` (không phải `ts.*`) — phân biệt RÕ với T4.0a/T4.3 (những
# track dạy CƠ CHẾ TypeScript cụ thể: kiểu, union, narrowing), vì đây là khái
# niệm PORTABLE, TypeScript chỉ là NGÔN NGỮ DIỄN ĐẠT.
#
# QUYẾT ĐỊNH KHÔNG DÙNG THƯ VIỆN (giống quyết định "không dùng toolz" ở T4.2,
# "không dùng zod/io-ts" ở T4.3): `fp/TypeScript_Books/part_5_fp_patterns/`
# (chương 25-30c, nguồn tham khảo) viết BẰNG `fp-ts`/`Effect-TS` — đã đo
# `packages/exec-typescript/package.json`: CHỈ có `typescript` + `sucrase`,
# KHÔNG có `fp-ts`/`effect`/bất kỳ thư viện FP nào. Track này TỰ VIẾT TAY mọi
# khái niệm (Option/Result/Monoid/map/chain/traverse/fold) bằng TypeScript
# thuần, không import gì ngoài chuẩn ngôn ngữ — đúng tinh thần "hiểu THẬT nó
# làm gì, không chỉ nhớ tên API thư viện" đã xuyên suốt track T4.1-T4.3.
#
# Ràng buộc đã đo trước khi viết (đo thật qua tsprobe.mjs, TypeScript 5.9,
# `strict: true` — KHÁC byte-rust, generic TypeScript THẬT hoạt động đầy đủ,
# không có bất đối xứng/lỗi unify nào như đã đo ở byte-rust cho T4.4):
#   - Option<T>/Result<T,E> tự viết (discriminated union, kiểu T4.3 đã dạy)
#     với hàm `mapOption<T,U>`/`chainOption<T,U>` GENERIC unify đúng — đã đo.
#   - Monoid (`{ ketHop: (a,b)=>T; rong: T }`) + `concatAll` bằng
#     `ds.reduce(m.ketHop, m.rong)` (nối T4.2's reduce) chạy đúng cho số,
#     chuỗi, mảng rỗng — đã đo.
#   - Applicative `map2` — CẢ hai chiến lược đã đo: fail-fast (dừng ở lỗi
#     ĐẦU) và collect-all (gom HẾT lỗi vào một mảng) đều chạy đúng, khác
#     nhau THẬT ở cách viết (không chỉ lý thuyết).
#   - Monad `chainOption`/`chainResult` (flatMap) làm PHẲNG kết quả lồng —
#     đã đo, phân biệt được với `map` (map để lại Option<Option<T>> nếu hàm
#     áp dụng CHÍNH NÓ trả Option; chain thì không).
#   - Traverse: `Array<Option<T>>` → `Option<Array<T>>` bằng vòng lặp có
#     short-circuit — đã đo (mảng có MỘT phần tử "khong" thì cả kết quả là
#     "khong", không phải mảng thiếu một chỗ).
#   - Catamorphism: `foldExpr<R>(e, boXuLy: BoXuLyExpr<R>): R` tách phần ĐỆ
#     QUY ra khỏi phần TÍNH TOÁN — đã đo dùng LẠI CÙNG một `foldExpr` cho
#     HAI việc khác nhau (tính giá trị, đếm số node) trên CÙNG một `Expr`
#     (tái dùng chính xác `Expr` đã dạy ở T4.3 cụm 6).
#   - **`tier: static` KHÔNG dùng được cho TypeScript** (giống T4.3) —
#     TsAstKind chưa cài, gate tự `throw`. Mọi bài `code` chỉ dùng
#     `run`/`tests`/`output`.
#   - Hai bẫy gate đã gặp thật ở T4.3 (xem
#     `docs/../HANDOFF` phiên trước / commit `9a59d85`): (1) chỗ trống nằm
#     trong nhánh KHÔNG bị test nào chạm tới — PHẢI có test ép chạy nhánh đó;
#     (2) đáp án đúng trùng với một trong ba literal "điền bừa" gate tự thử
#     (`0`/`'x'`/`true`) — PHẢI mở rộng phạm vi chỗ trống ra một biểu thức
#     LỚN HƠN bao trùm literal đó, không để một mình literal đơn độc làm chỗ
#     trống nếu nó trùng khả năng cao với `0`/`'x'`/`true`.
#
# NGUỒN THAM KHẢO (chỉ đọc Ý, KHÔNG chép code — chương gốc dùng fp-ts/Effect,
# track này viết lại HOÀN TOÀN bằng TypeScript thuần):
# `fp/TypeScript_Books/part_5_fp_patterns/chapter_26_functors_map.md`,
# `chapter_27_monads_bind.md`, `chapter_28_applicative_validation.md`,
# `chapter_29_monoids_algebra.md`, `chapter_30_traverse_sequence.md`,
# `chapter_30c_recursive_types_folds.md`.
#
# Ý XUYÊN SUỐT: nhiều "khuôn mẫu code" trông có vẻ khác nhau (cộng số, nối
# chuỗi, gộp mảng lỗi validate, làm phẳng Option lồng, lật Array<Option>) THẬT
# RA là MỘT khuôn hình học được LẶP LẠI — đại số cho phép ĐẶT TÊN khuôn đó
# MỘT LẦN, nhận ra nó ở khắp nơi, thay vì học lại từng trường hợp riêng lẻ.
#
# Namespace skill: `alg.*` — đã quét chéo KHÔNG trùng `teaches` toàn project.

