# SỔ SỰ THẬT CỦA THẾ GIỚI HƯ CẤU
#
# Cái xe bánh mì của Byte chạy suốt mạch T2.2 và ló sang cả T2.1. Mỗi hằng số
# của nó khai đúng MỘT lần ở đây; `tools/kiem_su_that.py` đối chiếu mọi bài.
#
# Vì sao cần: vòng phản biện T2.2 tìm ra tiền nguyên liệu mỗi ổ là 9 000 ở bài
# 2 và 5 000 ở bài 4; tiền thuê chỗ 30 nghìn ở bài 27 và 100 nghìn ở bài 34.
# Mỗi bài tự nó nhất quán, nên không cổng nào bắt được — chỉ khi xếp cạnh nhau
# mâu thuẫn mới lộ. Người học mang con số bài trước sang, ra đáp án khác, và
# tưởng lỗi ở mình.
#
# `tu_khoa` là các mẫu regex; nhóm bắt đầu tiên bắt được một con số chính là
# con số đem đối chiếu. Viết mẫu hẹp thôi — mẫu rộng thì bắt nhầm con số hàng
# xóm rồi báo một lỗi không có thật, và một cổng kêu oan sẽ bị người ta tắt đi.
#
# `ngoai_le` khai theo tệp, kèm lý do. Ngoại lệ không dùng tới là LỖI: nghĩa
# là sự thật đã trôi đi chỗ khác mà tờ miễn trừ vẫn nằm lại, sẵn sàng tha cho
# một lỗi thật — đúng cái bẫy `so-hoc-sai-co-y.yaml` đã tránh.

- ten: gia-ban-mot-o
  gia_tri: 15000
  cho_nghin: 1
  pham_vi: content/toan
  tu_khoa:
    - 'mỗi ổ bán[^.\n]{0,12}?({SO})\s*(?:nghìn|đồng|đ\b)'
    - 'một ổ bán[^.\n]{0,12}?({SO})\s*(?:nghìn|đồng|đ\b)'
    - 'bán ({SO}) nghìn một ổ'
  ngoai_le:
    - 'content/toan/02-dai-so-va-ham-so/36-boss-xe-banh-mi-cua-byte.lesson.md: câu 3 của BOSS cho GIÁ TĂNG DẦN (15 + x nghìn) — giá không còn là hằng số, đó chính là đề bài'
    - 'content/toan/02-dai-so-va-ham-so/29-dinh-va-hai-ben-doi-xung.lesson.md: cả bài dựng trên việc TĂNG/HẠ giá bán để tìm đỉnh — giá là biến của bài, không phải hằng số bị trôi'

- ten: von-nguyen-lieu-mot-o
  gia_tri: 9000
  cho_nghin: 1
  pham_vi: content/toan
  tu_khoa:
    - '(?:nguyên liệu|tiền vốn)[^.\n]{0,22}?({SO})\s*(?:nghìn|đồng|đ\b)'
    - 'mỗi ổ tốn ({SO})\s*(?:nghìn|đồng|đ\b)'

- ten: tien-thue-cho
  gia_tri: 30000
  cho_nghin: 1
  pham_vi: content/toan
  tu_khoa:
    - '({SO})\s*(?:nghìn|đồng|đ\b)[^.\n]{0,16}?(?:tiền )?thuê chỗ'
    - 'thuê chỗ[^.\n]{0,16}?({SO})\s*(?:nghìn|đồng|đ\b)'

- ten: di-tu-lay-san
  gia_tri: 2
  pham_vi: content/toan
  tu_khoa:
    - 'dì Tư[^.\n]{0,26}?lấy sẵn[^.\n]{0,8}?(\d+)\s*ổ'
    - 'dì Tư[^.\n]{0,26}?(\d+)\s*ổ'

- ten: lai-mot-o
  gia_tri: 6000
  cho_nghin: 1
  pham_vi: content/toan
  tu_khoa:
    - 'mỗi ổ (?:\*\*)?lãi (?:\*\*)?({SO})\s*(?:nghìn|đồng|đ\b)'
    - 'lãi ({SO})\s*(?:nghìn|đồng|đ\b) một ổ'
  ngoai_le:
    - 'content/toan/02-dai-so-va-ham-so/29-dinh-va-hai-ben-doi-xung.lesson.md: cùng lẽ — cả bài chạy trên lãi mỗi ổ đổi theo mức tăng giá'

# ── CLB cờ vua lớp 6A (hiện vật xuyên suốt T2.3) ──────────────────────────
#
# Sổ quỹ sáu tháng ghi 40 000 / 25 000 / 60 000 / 15 000 / 30 000 / 45 000 đồng,
# cộng lại là 215 000. Bài 31 và 32 chạy vòng `while` cộng dồn trên đúng cuốn sổ
# ấy, nên con số tổng đi vào cả văn xuôi, khối test lẫn tier `output` của hai
# bài. Khai ở đây để bài nào của T2.3 lỡ đặt một tổng khác thì lộ ra ngay, thay
# vì để người học cộng lại rồi tưởng mình sai.
- ten: quy-clb-sau-thang
  gia_tri: 215000
  cho_nghin: 1
  pham_vi: content/toan/03-logic-va-chung-minh
  tu_khoa:
    - 'tổng quỹ sáu tháng[^.\n]{0,16}?({SO})\s*(?:nghìn|đồng|đ\b)'

# ── Quán phở của Realm 0 ────────────────────────────────────────────────────
#
# Bảng giá này trôi qua BA bài trước khi có ai đếm lại: bài 22 (BOSS) khoá cứng
# nó trong `assert gia_to("nhỏ") == 40000` và trong regex tier `output`; bài 10
# để tô nhỏ 35000 và gọi cỡ thứ ba là "lớn"; bài 9 gọi ba cỡ là
# "nhỏ / thường / đặc biệt" với giá thứ ba là 60000. Ba bài, ba bảng giá, cùng
# một quán — và người học đi qua cả ba theo đúng thứ tự ấy.
#
# Lấy bộ của BOSS làm chuẩn vì nó là bộ duy nhất có máy canh.

- ten: gia-to-nho
  gia_tri: 40000
  cho_nghin: 1
  pham_vi: content/onboarding
  tu_khoa:
    - 'tô nhỏ[^.\n]{0,14}?({SO})\s*(?:nghìn|đồng|đ\b)'

- ten: gia-to-vua
  gia_tri: 45000
  cho_nghin: 1
  pham_vi: content/onboarding
  tu_khoa:
    - 'tô vừa[^.\n]{0,14}?({SO})\s*(?:nghìn|đồng|đ\b)'
  ngoai_le:
    - 'content/onboarding/02-ra-lenh-cho-byte/22-boss-may-tra-loi-tu-dong.lesson.md: câu "2 tô vừa, tổng cộng 90000 đồng" là TỔNG của hai tô, không phải giá một tô'

- ten: gia-to-to
  gia_tri: 55000
  cho_nghin: 1
  pham_vi: content/onboarding
  tu_khoa:
    - 'tô to[^.\n]{0,14}?({SO})\s*(?:nghìn|đồng|đ\b)'
