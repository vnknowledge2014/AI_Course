# Những khẳng định số học SAI mà bài học cố ý viết ra.
#
# `tools/kiem_so_hoc.py` tính lại mọi đẳng thức trong văn xuôi và báo lỗi khi
# hai vế lệch nhau. Nhưng một phần cách dạy toán ở đây là **viết ngộ nhận ra
# rồi bác bỏ nó** — người học đang mang sẵn luật "cộng tử với tử, cộng mẫu với
# mẫu" trong đầu, và giả vờ luật ấy không tồn tại thì không gỡ được nó.
#
# Mỗi mục dưới đây là một chỗ như vậy. Khoá là (tên file, biểu thức), KHÔNG
# phải số dòng: dòng trôi mỗi lần sửa một chữ ở trên nó, và một miễn trừ trôi
# khỏi chỗ nó canh sẽ lặng lẽ tha cho một lỗi thật ở dòng mới.
#
# Biểu thức biến mất khỏi bài thì miễn trừ thành THỪA và cổng báo đỏ. Đó là
# chủ ý: chỉ có một cách để một miễn trừ ở đây tồn tại, là chỗ nó canh vẫn còn.

