# Thứ tự học — nguồn sự thật duy nhất về "bài nào đứng trước bài nào".
#
# Tên thư mục KHÔNG quyết định thứ tự. `nen-tang` đứng sau `onboarding` dù
# xếp trước theo bảng chữ cái, và không có quy ước đặt tên nào sửa được điều
# đó mà không làm hỏng thứ khác. Nên thứ tự phải được ghi ra tường minh.
#
# `tools/kiem_do_thi.py` đọc file này để kiểm: mọi skill một bài YÊU CẦU đều
# phải được một bài ĐỨNG TRƯỚC nó DẠY. Thiếu thứ tự thật thì phép kiểm ấy
# vô nghĩa.

realm:
  - id: onboarding
    ten: "Realm 0 — Bãi đáp của Byte"
    # Dùng `module` trong frontmatter (slug KHÔNG mang số thứ tự), không dùng
    # tên thư mục. Số thứ tự thuộc về đường dẫn; danh tính module thì không —
    # cùng lý do `id` bài học không mang số (xem content-compiler/src/cli.ts).
    track:
      - may-tinh-noi-gi
      - ra-lenh-cho-byte

  - id: nen-tang
    ten: "Realm 1 — Nền tảng lập trình"
    track:
      # T1.1 chưa viết; giữ chỗ để thứ tự không đổi khi nó xuất hiện.
      - gia-tri-bien-kieu
      - re-nhanh-va-lap
      - ham-vien-gach
      - list-dict-set-tuple
      - chuong-trinh-that

  # Realm 2 đi SONG SONG với Realm 1, không nối tiếp — người học vào được khi
  # chưa biết vòng lặp hay hàm. Xếp nó sau ở đây chỉ để cổng đồ thị có một thứ
  # tự tuyến tính mà kiểm; nó KHÔNG có nghĩa là phải học hết Realm 1 trước.
  - id: toan
    ten: "Realm 2 — Toán & Toán rời rạc"
    track:
      - cam-nhan-so
      - dai-so-va-ham-so
      - logic-va-chung-minh
      # T2.4 mượn `∈`/`{x|...}` lần đầu (T2.3 cố ý chưa dùng — xem "Ranh
      # giới track" cuối mục T2.3 trong content/toan/MACH.md), và dùng lại
      # `all()`/`any()` (T2.3) để kiểm phản xạ/đối xứng/bắc cầu trên mọi
      # cặp. Đứng ngay sau logic-va-chung-minh, không song song.
      - tap-hop-quan-he-anh-xa

  # Realm 3 mở màn M8. T3.1 đứng đầu vì MASTERPLAN §9.1 giao cho nó việc "dọn
  # đường cho ownership" — người học gặp Rust ở R4.T4.0b, và mọi chỗ khó của
  # ownership đều quy về một câu hỏi T3.1 dựng lên: cái tên GIỮ giá trị, hay
  # nó chỉ CHỈ TỚI giá trị?
  #
  # Nó đứng sau Realm 1 vì mượn `core.list-aliasing`, `core.slice-copy`,
  # `core.argument-not-copy`; và sau Realm 2 vì mượn bảng vị trí của T2.1.
  - id: khoa-hoc-may-tinh
    ten: "Realm 3 — Khoa học máy tính"
    track:
      - bit-byte-va-bo-nho
      # T3.2 mượn `mem.address`, `mem.name-is-reference`, `mem.utf8-bytes`,
      # `mem.mutability` từ T3.1 (một nút liên kết CHÍNH LÀ tham chiếu T3.1
      # vừa dạy), và mượn `core.dict`/`core.string-immutable` từ R1 — đứng
      # ngay sau T3.1, không song song.
      - cau-truc-du-lieu
      # T3.3 đào sâu `func.recursion`/`func.call-stack` (R1.T1.3) bằng cách
      # nối chúng với `ds.stack` T3.2 vừa dựng, và dùng thẳng `ds.queue`,
      # `ds.graph-representation`, `ds.tree-traversal` của T3.2 cho BFS/DFS —
      # đứng ngay sau T3.2, không song song.
      - thuat-toan-va-do-phuc-tap
      # T3.4 dùng thẳng `ds.stack`/`ds.heap` (T3.2) và `alg.recursion-is-stack`/
      # `alg.recursion-limit`/`alg.count-recursive-calls` (T3.3) để mở nắp
      # tầng dưới: bytecode, fetch-decode-execute, và phân biệt "ngăn xếp/
      # đống CẤU TRÚC DỮ LIỆU" (T3.2) với "ngăn xếp/đống VÙNG BỘ NHỚ" (track
      # này) — đứng ngay sau T3.3, không song song.
      - may-chay-the-nao
      # T3.5 (track cuối Realm 3) dùng thẳng `ds.tree`/`ds.tree-traversal`
      # (T3.2), `alg.recursion-is-stack` (T3.3), `may.fetch-decode-execute`/
      # `may.eval-stack` (T3.4), và `mem.name-is-reference` (T3.1) để xây một
      # trình thông dịch nhỏ từ token tới cây tới đánh giá — đứng ngay sau
      # T3.4, không song song.
      - ngon-ngu-va-may-truu-tuong

  # Realm 4 mở màn M8 phần Functional Programming. T4.0a là CỔNG — 18 bài
  # dạy đúng một Ý (kiểu được kiểm TRƯỚC KHI CHẠY) bằng TypeScript, ngôn
  # ngữ ĐẦU TIÊN trong khoá ngoài Python. Đứng sau toàn bộ Realm 3 vì mượn
  # core.variable/core.function-def/core.function-parameter từ R1 — không
  # mượn gì từ R3, chỉ xếp sau R3 vì R3 vừa xong và đây là track kế tiếp
  # theo đúng thứ tự M8 (không có ràng buộc tiền đề bắt buộc phải sau R3).
  - id: lap-trinh-ham
    ten: "Realm 4 — Lập trình hàm"
    track:
      - cong-typescript
      # T4.0b mượn `mem.name-is-reference` thẳng từ T3.1 (câu hỏi "tên GIỮ
      # hay CHỈ TỚI giá trị?" mà ownership Rust đặt luật lên trên) — đứng
      # sau T4.0a vì đây là track kế tiếp theo đúng thứ tự M8 (không mượn
      # gì từ T4.0a, chỉ xếp sau vì T4.0a vừa xong).
      - cong-rust
      # T4.1 là track FP THẬT đầu tiên (T4.0a/T4.0b chỉ là cổng ngôn ngữ).
      # Mượn `mem.aliasing-explained`/`mem.mutability`/`mem.shallow-copy`
      # thẳng từ T3.1 — bài 1 dựng lại đúng vấn đề T3.1 đã nêu (nhiều tên
      # cùng trỏ một giá trị) rồi dạy KỶ LUẬT đối phó (không sửa tại chỗ).
      # Không mượn gì từ T4.0a/T4.0b, chỉ xếp sau vì đúng thứ tự M8.
      - bat-bien-thuan-khiet
      # T4.2 mượn `fp.pure-fn-def`/`fp.nondeterministic-impure` THẲNG từ
      # T4.1 (bài 14 dạy closure không thuần bằng đúng khái niệm T4.1 đã
      # dạy cho hàm; bài 26 nói composability đòi hỏi từng mắt xích thuần)
      # — đứng ngay sau T4.1, không song song.
      - ham-bac-cao-hop-thanh
      # T4.3 QUAY LẠI TypeScript — mượn THẲNG `ts.interface` từ T4.0a (bài 1
      # cần đúng cú pháp `interface` đó làm điểm xuất phát cho discriminated
      # union), không mượn gì từ T4.1/T4.2 (Python). Đứng sau T4.2 vì đúng
      # thứ tự M8, không vì ràng buộc tiền đề bắt buộc phải liền sau nó.
      - adt-pattern-matching
      # T4.4 (Generics · Traits · Type classes, Rust) BỊ HOÃN — đo thật qua
      # rustprobe.mjs xác nhận trait bound (<T: Trait>) và dyn Trait KHÔNG
      # parse được trong byte-rust, generic function top-level không unify
      # đúng — thành phần CỐT LÕI của track không dùng được, không có tập
      # con để né như T4.0b từng làm với move-check. Xem
      # docs/decisions/R4-T44-generics-traits-do-duoc.md. T4.5 xếp NGAY sau
      # T4.3, bỏ qua T4.4 — không mượn gì từ T4.4 (chưa tồn tại) hay T4.0b,
      # chỉ mượn THẲNG `ts.adt-gate-boss` từ T4.3 (bài 8 cần discriminated
      # union đã dạy làm nền cho Option/Result tự viết).
      - dai-so-cua-chuong-trinh
      # T4.6 (Parser combinators & interpreter, Rust) CŨNG BỊ HOÃN — đo
      # thật qua rustprobe.mjs xác nhận HAI lỗ hổng độc lập: closure gán
      # biến rồi gọi qua tên biến không hoạt động (không có cú pháp kiểu
      # nào cho tham số hàm là closure), VÀ bộ kiểm mượn/di chuyển từ chối
      # "chưa hỗ trợ" bất kỳ biến non-Copy nào bị chạm ở ≥2 nhánh if/else —
      # khuôn bắt buộc có ở mọi recursive-descent parser thật. Xem
      # docs/decisions/R4-T46-parser-combinator-do-duoc.md. Với CẢ T4.4 và
      # T4.6 hoãn, Realm 4 dừng ở 6/8 track (186/260 bài) cho tới khi có
      # đầu tư hạ tầng byte-rust riêng.

