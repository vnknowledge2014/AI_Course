# Xương sống R5.T5.6 — Bảo mật ứng dụng (26 bài) — TypeScript
#
# Track THỨ HAI của Realm 5 (Kỹ nghệ phần mềm), sau T5.3 (DDD, 42/42 xong).
# T5.1 ("Git, MỚI") vẫn hoãn — cần engine WASM mới hoàn toàn. T5.6 được chọn
# TIẾP THEO vì có NGUỒN THAM KHẢO trực tiếp, đầy đủ như T5.3: đúng HAI chương
# trọn vẹn trong `fp/TypeScript_Books/part_7_production/`:
#   - chapter_39_security_essentials.md (415 dòng) — Auth/AuthZ, JWT, RBAC/ABAC
#   - chapter_40_app_security_hardening.md (392 dòng) — SQLi/XSS/CSRF, rate
#     limiting, security headers, secrets management
# Cả hai đã đọc TOÀN BỘ qua 2 agent phân tích song song (2026-09-02), tổng
# hợp thành 13 bài/chương — khớp CHÍNH XÁC 26 bài MASTERPLAN ghi cho T5.6.
#
# QUYẾT ĐỊNH KHÔNG DÙNG THƯ VIỆN (giống T4.3/T4.5/T5.3): CẢ HAI chương chỉ
# nhắc bcrypt/argon2/jose/passport/helmet/Prisma/Vault/AWS-Secrets-Manager
# TRONG COMMENT — code THỰC THI trong cả hai chương đã tự viết tay 100% bằng
# TS thuần. `import assert from "node:assert/strict"` xuất hiện ở MỌI khối
# code (module Node built-in, KHÔNG dùng được trong sandbox, KHÔNG cần vì dự
# án có `:::validate`/`tier: tests` riêng).
#
# BẪY SANDBOX ĐÃ BIẾT, ÁP DỤNG LẠI (xem quyết định T5.3 bài 8): KHÔNG
# async/await/Promise/.then()/setTimeout — chương 39's OAuth 2.0 flow (§39.4)
# VỐN DĨ đã chỉ là comment/pseudocode (redirect tới accounts.google.com, POST
# đổi code — cần MẠNG THẬT, không giả lập được) → GIỮ NGUYÊN dạng tường
# thuật/liệt kê bước, KHÔNG BAO GIỜ biến thành `code` step. `process.env`
# (chương 40 §Secrets) → thay bằng object `env: Record<string, string |
# undefined>` giả lập. `Buffer.from(...).toString("base64url")` (chương 39's
# JWT signing) → Node API không có trong sandbox, thay bằng hàm checksum tự
# viết (rõ ràng ghi "KHÔNG PHẢI mã hoá thật, chỉ minh hoạ HÌNH DẠNG kỹ
# thuật" — same framing sách nguồn đã dùng cho `createSimpleHash`).
#
# TÁI DÙNG THẲNG Result<T,E> TỪ T4.5 (giống T5.3): chương 39's Bài tập 2 dùng
# shape `{tag:"ok"|"err", value, error}` — track này ĐỔI sang shape ĐÃ CÓ
# `{kind:"ok"|"loi", giaTri, loi}` + `chainResult`, KHÔNG dạy lại composition
# theory, chỉ áp dụng vào miền auth pipeline MỚI (bài 13's capstone).
#
# QUYẾT ĐỊNH "CRYPTO GIẢ LẬP": không có `crypto`/hashing thật trong sandbox.
# MỌI hàm "hash"/"chữ ký" trong track này là HÀM TỰ VIẾT rõ ràng gắn nhãn
# "minh hoạ, KHÔNG PHẢI mã hoá thật" — đúng tinh thần sách nguồn đã làm với
# `createSimpleHash`/`Math.random()`-based CSRF token. Bài học SỐNG CÒN
# (tính chất one-way, salt phá rainbow table, ký/xác minh, gói không gói lại
# được) vẫn dạy ĐÚNG qua hàm giả lập — chỉ tên gọi rõ ràng "đây không phải
# sản phẩm dùng thật".
#
# world: blueprint-board (sum type hở → bug BÒ RA — MASTERPLAN §R5)
# skill namespace: bmud.* (Bảo Mật ỨNg Dụng) — namespace MỚI, không trùng
# ddd.*/ts.*/alg.* đã dùng ở R4/T5.3.

