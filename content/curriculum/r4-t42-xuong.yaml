# ── Cụm 3 (bài 12–18): Closures — hàm "nhớ" môi trường ────────────────────
  - so: 12
    slug: closure-ham-nho-moi-truong
    title: "Closure — hàm bên trong VẪN THẤY biến của hàm ngoài, sau khi hàm ngoài đã return"
    teaches: [fp.closure-basics]
    requires: [fp.review-hof]
    y_chinh: "`def lam_bang(k): return lambda x: x * k` rồi `nhan3 = lam_bang(3)` — sau khi `lam_bang(3)` ĐÃ RETURN XONG, hàm được trả về VẪN nhớ `k=3` khi gọi `nhan3(5)`. Đây gọi là **closure** — hàm 'đóng gói' (close over) môi trường nó được tạo ra, mang theo dù môi trường đó (lời gọi `lam_bang`) đã kết thúc. Bài explain/predict, dựng khái niệm trước code."
  - so: 13
    slug: closure-thuan-chi-doc
