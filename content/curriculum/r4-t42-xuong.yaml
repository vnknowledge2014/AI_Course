# ── Cụm 5 (bài 25–30): Pipeline dữ liệu thật + BOSS ───────────────────────
  - so: 25
    slug: pipeline-xu-ly-du-lieu-that
    title: "Một pipeline xử lý dữ liệu thật: chuẩn hoá → lọc → biến đổi → tổng hợp"
    teaches: [fp.real-pipeline]
    requires: [fp.review-composition]
    y_chinh: "Bài code có chấm điểm sống: xử lý một chuỗi văn bản qua `pipe()` — chuẩn hoá (`.strip().lower()`), tách từ (`.split()`), lọc từ ngắn, đếm số từ còn lại — mỗi bước một hàm THUẦN riêng, ghép bằng `pipe`. Ví dụ thực tế, không phải bài tập trừu tượng — mô phỏng đúng cách `pipe`/`compose` được dùng trong mã thật."
  - so: 26
    slug: ghep-doi-hoi-tung-mat-xich-thuan
    title: "Ghép được AN TOÀN đòi hỏi MỖI mắt xích phải thuần"
    teaches: [fp.composability-needs-purity]
    requires: [fp.real-pipeline, fp.pure-fn-def]
    y_chinh: "Bài LÝ THUYẾT, nối thẳng T4.1: nếu MỘT hàm trong chuỗi `pipe` không thuần (ví dụ gọi `random.random()` giữa chừng), cả PIPELINE mất khả năng dự đoán — `pipe(x, f, g, h)` không còn cho cùng kết quả với cùng `x`, dù `f`, `h` đều thuần. Bài predict: cho một pipeline có MỘT hàm giữa chừng không thuần, hỏi gọi hai lần có ra cùng kết quả không (không — dù đầu và cuối chuỗi đều thuần, MỘT mắt xích hỏng là đủ để phá cả chuỗi)."
  - so: 27
    slug: debug-bang-ham-tap
    title: "Debug một pipeline bằng hàm `tap` — soi giá trị giữa chừng, không đổi kết quả"
    teaches: [fp.debug-with-tap]
    requires: [fp.composability-needs-purity]
    y_chinh: "`def tap(nhan): return lambda x: (print(f'{nhan}: {x}'), x)[1]` — chèn `tap('sau loc')` vào GIỮA một chuỗi `pipe` để IN ra giá trị tại đúng bước đó, rồi TRẢ LẠI giá trị y hệt (không đổi luồng dữ liệu). Đây là công cụ THỰC TẾ: một `pipe` dài nhiều bước rất khó biết bước nào ra sai, `tap` cho nhìn vào GIỮA chuỗi mà không phải tách nó ra viết lại. Code chấm điểm sống."
  - so: 28
    slug: mot-mat-xich-nem-loi-dung-cho
    title: "Một mắt xích NÉM LỖI — pipeline dừng ĐÚNG CHỖ, không lặng lẽ tiếp tục"
    teaches: [fp.pipeline-error-handling]
    requires: [fp.debug-with-tap]
    y_chinh: "Nếu một hàm giữa chuỗi `pipe` (ví dụ `int('abc')`) ném `ValueError`, TOÀN BỘ `pipe` dừng ngay tại đó — các hàm SAU không chạy, lỗi lộ ra với traceback trỏ ĐÚNG bước gây lỗi (nhờ `reduce` bên dưới chạy tuần tự, không có bước nào 'nuốt' lỗi âm thầm). Code chấm điểm sống: test một pipeline với input hợp lệ (chạy hết) và input gây lỗi giữa chừng (dừng đúng chỗ, `try/except` bắt đúng loại lỗi)."
