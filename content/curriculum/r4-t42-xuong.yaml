# Xương sống R4.T4.2 — HOF & Composition (30 bài)
#
# Track FP thứ hai của Realm 4, dùng lại Python (như T4.1). Ý XUYÊN SUỐT:
# hàm LÀ MỘT GIÁ TRỊ — gán được, truyền được, trả về được, GHÉP được — và
# việc GHÉP nhiều hàm nhỏ, đã kiểm riêng lẻ, thành một hàm lớn chỉ AN TOÀN
# khi từng mắt xích THUẦN (nối thẳng T4.1: một hàm impure trong một chuỗi
# ghép làm cả chuỗi mất khả năng dự đoán).
#
# NGUỒN THAM KHẢO (chỉ đọc, KHÔNG sửa):
# `fp/Python_Books/part_1_fundamentals/chapter_07_functions_closures.md`
# (hàm là giá trị, map/filter/reduce, closure, functools.partial) và
# `fp/Python_Books/part_2_thinking_functionally/chapter_12_composition_pipelines.md`
# (compose/pipe, method chaining). Mượn Ý và ví dụ gốc, KHÔNG chép nguyên
# văn — xương dưới mở rộng hai chương thành 30 bài.
#
# QUYẾT ĐỊNH HẠ TẦNG ĐÃ ĐO: chương 12 gốc dùng thư viện `toolz`
# (`toolz.curry`, `toolz.pipe`, `compose_left`) — ĐÃ ĐO THẬT: `import
# toolz` trên Pyodide của khoá NÉM LỖI ("You can install it by calling
# await micropip.install(...)" — `kiem_ma_bai_hoc.mjs` không làm việc đó,
# gọi đồng bộ `py.runPython()`). TRACK NÀY KHÔNG DÙNG `toolz` Ở BẤT CỨ
# ĐÂU — mọi `compose`/`pipe`/`curry` đều TỰ VIẾT bằng Python thuần (đã đo
# thật, chạy sạch). Đây không phải một thoả hiệp hạ tầng — nó ĐÚNG tinh
# thần dự án: hiểu compose/pipe bằng cách TỰ VIẾT, không phải học API của
# một thư viện.
#
# `map()`/`filter()` trả về ITERATOR (không phải `list`) — đã đo thật,
# cần `list(...)` để ép ra hoặc lặp trực tiếp. Bài dạy map/filter PHẢI nói
# rõ điều này, đừng ngầm định chúng trả list.
#
# Namespace skill: `fp.*` (tiếp tục namespace T4.1, cùng track FP). Thư
# mục nội dung: `content/lap-trinh-ham/03-ham-bac-cao-hop-thanh/`.

