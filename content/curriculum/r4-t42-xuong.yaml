    teaches: [fp.closure-impure]
    requires: [fp.closure-pure, fp.nondeterministic-impure]
    y_chinh: "`def lam_dem(bat_dau=0): dem = bat_dau; def tang(): nonlocal dem; dem += 1; return dem; return tang` — `dem += 1` SỬA biến `dem` của hàm NGOÀI, mỗi lần gọi cho một kết quả KHÁC nhau. Nối thẳng T4.1's `fp.nondeterministic-impure`: đây CHÍNH LÀ 'phụ thuộc trạng thái bên ngoài tham số', chỉ khác chỗ trạng thái đó nằm trong CHÍNH closure, không phải một biến toàn cục. Đã đo thật. Bài predict: gọi hàm đếm hai lần, đoán hai kết quả (khác nhau, không phải bằng nhau như bài 13)."
  - so: 15
    slug: nhan-biet-closure-khong-thuan
