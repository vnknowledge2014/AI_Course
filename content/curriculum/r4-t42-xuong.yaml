    requires: [fp.closure-impure]
    y_chinh: "Một bộ đếm (`fp.closure-impure`) hữu ích THẬT — nhưng phải BIẾT nó không thuần, không được `assert dem() == dem()` (sẽ luôn `False`, KHÁC closure thuần bài 13 luôn `True`). Bài code: viết một hàm dùng closure thuần cho một việc, closure KHÔNG thuần cho việc khác trong CÙNG chương trình, test phân biệt đúng hành vi từng loại — không dạy 'closure không thuần là sai', dạy 'phải biết nó thuộc loại nào để test đúng cách'."
