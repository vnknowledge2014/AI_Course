[workspace]
resolver = "2"
members = ["crates/*", "apps/byte/src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.97"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Bản release cho WASM: ưu tiên kích thước, vì module phải nạp được trên mobile.
[profile.release.package.byte-rust]
opt-level = "z"
