[package]
name = "byte-rust"
version = "0.1.0"
edition = "2021"
description = "Interpreter cho tập con Rust dùng trong giảng dạy, biên dịch được sang WASM"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

# Profile release cho crate này nằm ở Cargo.toml gốc workspace
# ([profile.release] + [profile.release.package.byte-rust]) — Cargo chỉ áp
# dụng profile khai ở root, khai lại ở đây bị lờ đi im lặng ("warning: profiles
# for the non root package will be ignored, specify profiles at the workspace
# root" khi chạy `cargo check --workspace`).
