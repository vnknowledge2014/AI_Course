[package]
name = "byte-app"
version = "0.1.0"
description = "Byte — học lập trình từ số không"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Tên crate phải là `_lib` trên mobile: `byte_app` sẽ đụng với tên binary trên
# desktop, và Android/iOS đều nạp thư viện qua tên này.
name = "byte_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
byte-rust = { path = "../../../crates/byte-rust" }
